<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8fb"><title>Klassen-Cockpit · Kathleens Kiste</title><style>
:root{--ink:#564459;--muted:#8e7a90;--line:#eadfea;--pink:#d58eb4;--violet:#a98bdd;--bg:#fff9fc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#fff 0,#fff8fb 38%,#f8f2fb 100%);color:var(--ink);font-family:Inter,ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh}.shell{width:min(1120px,94vw);margin:auto;padding:26px 0 70px}.head{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:12px}.icon{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#f5d8e8,#ded3fa);font-size:25px;box-shadow:0 8px 24px #cba9c638}.head h1{font-size:25px;margin:0}.head p{margin:4px 0 0;color:var(--muted);font-size:10px}.actions{display:flex;gap:7px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;min-height:40px;padding:0 12px;color:var(--ink);font-weight:900;font-size:9px;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff}.context{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 12px 35px #765d7712;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.context select{width:100%;border:0;background:transparent;font-size:18px;font-weight:950;color:var(--ink);outline:none}.contextMeta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.chip{padding:6px 9px;border-radius:999px;background:#f5eef6;color:#755f78;font-size:8px;font-weight:900}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;margin-top:12px}.panel{border:1px solid var(--line);border-radius:20px;background:#fff;padding:15px;box-shadow:0 12px 35px #765d770e}.panel h2{font-size:14px;margin:0 0 10px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tool{border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#fff,#fff9fc);padding:14px;text-align:left;min-height:92px;color:var(--ink);cursor:pointer}.tool span{font-size:24px}.tool b{display:block;font-size:11px;margin-top:8px}.tool small{display:block;font-size:8px;color:var(--muted);margin-top:3px}.roster{display:grid;gap:5px;max-height:380px;overflow:auto}.student{display:flex;align-items:center;justify-content:space-between;padding:8px 9px;border:1px solid #f0e7ef;border-radius:11px;font-size:9px;font-weight:850}.student i{font-style:normal;color:var(--muted);font-size:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.stat{border:1px solid var(--line);border-radius:14px;padding:11px;background:#fffafd}.stat b{display:block;font-size:17px}.stat span{font-size:8px;color:var(--muted)}.empty{padding:25px 10px;border:1px dashed #dfd0df;border-radius:13px;text-align:center;color:var(--muted);font-size:9px}@media(max-width:760px){.shell{padding-top:18px}.head{align-items:flex-start}.head h1{font-size:21px}.grid{grid-template-columns:1fr}.quick{grid-template-columns:1fr 1fr}.context{grid-template-columns:1fr}.contextMeta{justify-content:flex-start}.tool{min-height:100px}}</style></head><body><main class="shell"><header class="head"><div class="brand"><div class="icon">👥</div><div><h1>Klassen-Cockpit</h1><p>Alles für eine Klasse an einem Ort.</p></div></div><div class="actions"><button class="btn" id="lock">Sperren</button><button class="btn" id="back">← Tools</button></div></header><section class="context"><select id="classSelect"></select><div class="contextMeta"><span class="chip" id="subjectChip">Fach –</span><span class="chip" id="roomChip">Raum –</span><span class="chip" id="liveChip">Classroom offline</span></div></section><div class="grid"><section class="panel"><h2>Schnellzugriff</h2><div class="quick"><button class="tool" data-go="board"><span>✨</span><b>Whiteboard</b><small>Unterricht & Classroom</small></button><button class="tool" data-go="seating"><span>🪑</span><b>Sitzplan</b><small>Lehrerzentrale</small></button><button class="tool" data-go="observations"><span>👁️</span><b>Beobachtungen</b><small>Mitarbeit erfassen</small></button><button class="tool" data-go="homework"><span>✓</span><b>Hausaufgaben</b><small>Striche & Überblick</small></button><button class="tool" data-go="random"><span>🎲</span><b>Zufall</b><small>Schüler auswählen</small></button><button class="tool" data-go="teams"><span>🧩</span><b>Teams</b><small>Gruppen bilden</small></button></div></section><aside class="panel"><h2>Klassenüberblick</h2><div class="stats"><div class="stat"><b id="studentCount">0</b><span>Schüler</span></div><div class="stat"><b id="seatCount">0</b><span>gesetzt</span></div><div class="stat"><b id="onlineCount">0</b><span>online</span></div></div><div class="roster" id="roster"></div><h2 style="margin-top:15px">Offene To-dos</h2><div class="roster" id="classTodos"></div></aside></div></main><script src="../classroom-tools-shared.js?v=20260922-0713"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s);let lists=[],current=null;const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function plan(){try{const db=JSON.parse(localStorage.getItem('kathleenSeatPlansV2')||localStorage.getItem('kathleenSeatPlansV1')||'{}');return db[current?.id]||Object.values(db).find(x=>x.className===current?.name)||null}catch(e){return null}}function context(){const lm=KathleenLessonMode?.get?.();$('#subjectChip').textContent='Fach '+(lm?.classId===current?.id?lm.subject:'–');$('#roomChip').textContent='Raum '+(lm?.classId===current?.id&&lm.room?lm.room:'–');const cr=KathleenClassLists.getClassroomState?.();$('#liveChip').textContent=cr&&cr.classId===current?.id?'● '+(cr.connectedCount||0)+' / '+(cr.rosterCount||current.students.length)+' live':'Classroom offline';$('#onlineCount').textContent=cr&&cr.classId===current?.id?cr.connectedCount||0:0}function renderTodos(){let a=[];try{a=JSON.parse(localStorage.getItem('kathleen-home-todos-v1')||'[]')}catch(e){}const rows=a.filter(x=>!x.done&&String(x.classId||'')===String(current?.id||''));$('#classTodos').innerHTML=rows.length?rows.slice(0,6).map(x=>'<div class="student"><span>'+esc(x.text)+'</span><i>'+(x.due?'⏰':'')+'</i></div>').join(''):'<div class="empty">Keine klassenbezogenen To-dos offen.</div>'}function render(){current=lists.find(c=>c.id===$('#classSelect').value)||lists[0]||null;if(!current){$('#roster').innerHTML='<div class="empty">Keine Klasse vorhanden.</div>';return}KathleenClassLists.setGlobalClass?.(current.id,current.name);$('#studentCount').textContent=current.students.length;const p=plan(),seated=new Set((p?.desks||[]).flatMap(d=>d.names||[]).filter(Boolean));$('#seatCount').textContent=seated.size;$('#roster').innerHTML=current.students.map(n=>'<div class="student"><span>'+esc(n)+'</span><i>'+(seated.has(n)?'🪑':'')+'</i></div>').join('');renderTodos();context()}function go(t){const routes={board:'../classroom-board/',seating:'../seating-plan/',observations:'../schulaufgabenrechner/#observations',homework:'../homework-strikes/',random:'../randomizer/',teams:'../team-generator/'};if(routes[t])location.href=routes[t]}(async()=>{if(!await KathleenClassLists.requireUnlock())return;lists=KathleenClassLists.load();const g=KathleenClassLists.getGlobalClass?.();$('#classSelect').innerHTML=lists.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('');if(g&&lists.some(c=>c.id===g.id))$('#classSelect').value=g.id;$('#classSelect').onchange=render;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$('#lock').onclick=()=>KathleenClassLists.lock(true);$('#back').onclick=()=>location.href='../../#tools';render()})();})();</script><script src="../lesson-mode.js?v=20260921-2224"></script><script src="../kathleen-i18n.js?v=20260921-2224"></script><script src="../teacher-shell.js?v=20260922-1900"></script></body></html>
