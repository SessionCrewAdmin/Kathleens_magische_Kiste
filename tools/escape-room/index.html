<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escape Room Builder</title><style>*{box-sizing:border-box}body{margin:0;background:#fff9fc;color:#503d51;font-family:Inter,Arial}.wrap{max-width:1050px;margin:auto;padding:22px}.head,.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.panel{border:1px solid #eadde9;border-radius:22px;padding:17px;background:#fff;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea,select,button{font:inherit;border:1px solid #eadde9;border-radius:11px;padding:10px;background:#fff;color:#503d51}textarea{width:100%;min-height:90px}.room{border:1px solid #eadde9;border-radius:15px;padding:12px;margin-top:8px}.timer{font-size:38px;font-weight:1000}.victory{text-align:center;font-size:28px;padding:35px}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="head"><div><small>PRIVATE PREVIEW · QUEST MODE</small><h1>🔐 Escape Room Builder</h1></div><button id="add">＋ Rätsel</button></div><section class="panel grid"><label>Titel<input id="title" value="Das Geheimnis der magischen Kiste"></label><label>Zeitlimit<input id="minutes" type="number" value="30" min="5"></label><label>Teams<select id="teams"><option>2</option><option selected>4</option><option>6</option></select></label><label>Joker pro Team<input id="jokers" type="number" value="2" min="0"></label></section><section class="panel"><h3>Rätsel / Hinweise / Codes</h3><div id="rooms"></div></section><section class="panel"><div class="row"><button id="start">▶ Game starten</button><button id="hint">💡 Hinweis</button><button id="joker">🃏 Joker</button><button id="win">🏆 Victory</button><b class="timer" id="timer">30:00</b></div></section><section class="panel" id="stage">Lehrersteuerung bereit. QR-Codes können pro Rätsel über die jeweilige URL erzeugt werden.</section></main><script src="../gamification-preview.js?v=20260922-lessonfinish1"></script><script>let rs=[],left=1800,t=null;function render(){rooms.innerHTML=rs.map((r,i)=>'<div class="room"><b>Rätsel '+(i+1)+'</b><input data-i="'+i+'" data-k="title" value="'+r.title+'" placeholder="Titel"><textarea data-i="'+i+'" data-k="task" placeholder="Aufgabe / Hinweis">'+r.task+'</textarea><input data-i="'+i+'" data-k="code" value="'+r.code+'" placeholder="Lösungscode"><small>QR-Ziel: '+location.href.split('?')[0]+'?room='+(i+1)+'</small></div>').join('');rooms.querySelectorAll('[data-i]').forEach(x=>x.oninput=()=>rs[x.dataset.i][x.dataset.k]=x.value)}add.onclick=()=>{rs.push({title:'Neue Mission',task:'',code:''});render()};add.click();start.onclick=()=>{left=Number(minutes.value)*60;clearInterval(t);t=setInterval(()=>{left=Math.max(0,left-1);timer.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(!left)clearInterval(t)},1000);stage.textContent='🎮 Escape Room läuft · '+teams.value+' Teams · '+jokers.value+' Joker/Team'};hint.onclick=()=>stage.textContent='💡 Hinweis freigegeben';joker.onclick=()=>stage.textContent='🃏 Joker eingesetzt';win.onclick=()=>{clearInterval(t);stage.innerHTML='<div class="victory">🏆 Mission geschafft!<br><small>Victory Screen · Ergebnisse und Quest-Belohnung freigegeben</small></div>';window.dispatchEvent(new CustomEvent('kathleen:game-action',{detail:{source:'escape-room',type:'game-finished'}}))};</script></body></html>
