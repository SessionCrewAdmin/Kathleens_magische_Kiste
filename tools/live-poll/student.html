<style>

button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{max-width:820px;margin:auto;padding:22px 14px calc(22px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column}.top{text-align:center;margin:6px 0 16px}.badge{width:54px;height:54px;margin:auto;border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(240,229,247,.72));border:1px solid rgba(255,255,255,.9);display:grid;place-items:center;font-size:26px;box-shadow:0 14px 36px rgba(96,65,102,.15),inset 0 1px 0 #fff}h1{font-size:28px;margin:9px 0 4px;color:#674969;letter-spacing:-.03em}.sub{font-size:11px;color:var(--muted);margin:0}.card{background:linear-gradient(160deg,rgba(255,255,255,.82),rgba(250,244,252,.65));border:1px solid rgba(255,255,255,.82);border-radius:22px;padding:18px;box-shadow:0 24px 70px rgba(93,62,98,.14),inset 0 1px 0 rgba(255,255,255,.94);backdrop-filter:blur(24px) saturate(160%)}.join{max-width:430px;margin:auto;width:100%;padding:22px}.label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:950;margin-bottom:5px}.code-input{width:100%;border:1px solid rgba(196,173,201,.52);border-radius:16px;padding:16px;text-align:center;text-transform:uppercase;font-size:32px;font-weight:950;letter-spacing:.12em;background:rgba(255,255,255,.78);color:var(--ink);outline:none;box-shadow:inset 0 1px 0 #fff}.btn{border:1px solid var(--line);background:rgba(255,255,255,.78);color:var(--ink);border-radius:13px;padding:11px 14px;font-weight:900;min-height:46px}.btn.primary{border:0;color:#fff;background:linear-gradient(135deg,#d790b5,#aa8cde)}.btn:disabled{opacity:.5;cursor:not-allowed}.join .btn{width:100%;margin-top:9px;min-height:54px;font-size:15px}.poll-card{display:none}.poll-card.show{display:block;animation:cardIn .28s ease}@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}.meta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid rgba(224,210,226,.65)}.session-code{font-size:10px;color:var(--muted);font-weight:900}.status{font-size:9px;border-radius:999px;padding:5px 8px;font-weight:900;background:#edf8f4;color:#51836e;box-shadow:inset 0 1px 0 #fff}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#60ae8c;margin-right:5px}.status.locked{background:#fff5e8;color:#916a36}.status.closed{background:#f3f0f2;color:#7e727a}.question{font-size:clamp(30px,7vw,48px);line-height:1.12;letter-spacing:-.045em;margin:18px 0 22px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.option{position:relative;border:1px solid rgba(214,196,218,.75);background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(251,246,252,.78));border-radius:18px;padding:18px 16px 18px 62px;text-align:left;font-size:16px;font-weight:850;color:var(--ink);min-height:92px;box-shadow:0 10px 26px rgba(90,61,95,.08);transition:.16s}.option:before{content:attr(data-letter);position:absolute;left:15px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:11px;font-weight:1000;color:#fff;background:linear-gradient(135deg,#d98ab3,#a88ddd)}.option.selected{border-color:#c7a7d0;background:linear-gradient(135deg,rgba(255,238,247,.94),rgba(239,235,255,.92));box-shadow:0 0 0 4px rgba(203,157,190,.12),0 14px 34px rgba(92,61,98,.12)}.option.selected:after{content:"✓";position:absolute;right:14px;top:14px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#6e5577;color:#fff;font-weight:1000}
.star-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.star{border:1px solid rgba(214,196,218,.75);background:rgba(255,255,255,.78);border-radius:16px;min-height:82px;font-size:34px;color:#cfc2d2}.star.selected,.star:hover{background:linear-gradient(135deg,#fff2c7,#fff7e4);color:#e0a62a;transform:translateY(-2px)}
.rank-list{display:grid;gap:8px}.rank-item{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;padding:11px;border:1px solid rgba(214,196,218,.75);background:rgba(255,255,255,.78);border-radius:14px}.rank-num{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#d98ab3,#a88ddd);color:#fff;display:grid;place-items:center;font-weight:1000}.rank-actions{display:flex;gap:4px}.rank-actions button{border:1px solid #ded0e0;background:#fff;border-radius:8px;width:32px;height:32px;color:#655067}
.open-answer{width:100%;min-height:110px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.78);padding:12px;color:var(--ink);resize:vertical;font-size:16px}.word-input{min-height:58px;text-align:center;font-size:24px;font-weight:900}.submit-row{display:flex;gap:8px;margin-top:16px}.submit-row .btn{flex:1;min-height:52px}.message{margin-top:12px;border-radius:13px;padding:11px 12px;font-size:11px;font-weight:800;line-height:1.45}.message.ok{background:linear-gradient(135deg,#e9f8f1,#f4fbf8);border:1px solid #cfe9dc;color:#4e806c}.message.warn{background:#fff5e8;color:#8f6938}.results{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}.results h2{font-size:14px;margin:0 0 10px}.bars{display:grid;gap:8px}.bar-row{display:grid;grid-template-columns:28px 72px 1fr 34px;gap:7px;align-items:center}.answer-key{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:9px;font-weight:1000;color:#fff;background:linear-gradient(135deg,#d98ab3,#a88ddd)}.bar-label{font-size:10px;font-weight:850}.track{height:28px;border-radius:10px;background:#f3eaf0;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#d790b5,#aa8cde);border-radius:10px}.bar-num{text-align:right;font-size:10px;font-weight:950}.answers{display:grid;gap:6px}.answer{font-size:10px;line-height:1.4;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(251,246,252,.78));border-radius:13px;padding:11px 12px}.wordcloud{min-height:190px;display:flex;gap:9px 12px;flex-wrap:wrap;align-content:center;justify-content:center}.wordcloud span{font-weight:950;color:#664f6c}.ranking{display:grid;gap:7px}.ranking .answer{display:flex;justify-content:space-between;gap:8px}.footer{text-align:center;font-size:9px;color:var(--muted);margin-top:13px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);z-index:100;background:#684d72;color:#fff;border-radius:999px;padding:10px 14px;font-size:11px;font-weight:850;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:600px){.shell{padding:10px 9px calc(18px + env(safe-area-inset-bottom))}.top{margin-bottom:10px}.badge{width:46px;height:46px}h1{font-size:24px}.card{padding:14px;border-radius:18px}.question{font-size:31px}.options{grid-template-columns:1fr}.option{min-height:74px}.star{min-height:66px;font-size:28px}}
</style></head><body><main class="shell"><header class="top"><div class="badge">📊</div><h1>Live Poll</h1><p class="sub">Anonym teilnehmen · keine Anmeldung nötig. · V21.5</p></header>
<section class="card join" id="joinCard"><label class="label">Session-Code</label><input class="code-input" id="codeInput" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABC123"><button class="btn primary" id="joinBtn">Teilnehmen</button></section>
<section class="card poll-card" id="pollCard"><div class="meta"><span class="session-code" id="sessionCode"></span><span class="status" id="status">Offen</span></div><div class="question" id="question"></div><div id="answerArea"></div><div class="submit-row"><button class="btn primary" id="submitBtn">Antwort senden</button><button class="btn" id="changeBtn">Ändern</button></div><div class="message hidden" id="message"></div><div class="results hidden" id="resultsWrap"><h2>Live-Ergebnis</h2><div id="results"></div></div></section><div class="footer">Frau Müller · Live Poll</div></main><div class="toast" id="toast"></div>
<script>
(()=>{const SUPABASE_URL='https://fzqxnjhuvgpgovcovosl.supabase.co',SUPABASE_KEY='sb_publishable_GIyyWoyaQXipaA4S9OuTyQ_cZn7LUgV';const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));let code='',state=null,selected=null,multiSelected=new Set(),ranking=[],lastQuestionId='',timer=null;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1700)}async function rpc(name,body={}){const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(name+' '+r.status+' '+await r.text());const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():null}function token(){let t=localStorage.getItem('kathleenPollVoterToken');if(!t){t=(crypto.randomUUID?crypto.randomUUID():'v-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));localStorage.setItem('kathleenPollVoterToken',t)}return t}function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]))}function normalizeCode(v){return String(v||'').toUpperCase().replace(/[^A-F0-9]/g,'').slice(0,6)}
async function join(){code=normalizeCode($('#codeInput').value);if(code.length!==6){toast('Bitte 6-stelligen Code eingeben');return}$('#joinBtn').disabled=true;try{const d=await rpc('poll_public_state',{p_code:code});if(!d||!d.exists){toast('Session nicht gefunden');$('#joinBtn').disabled=false;return}$('#joinCard').classList.add('hidden');$('#pollCard').classList.add('show');$('#sessionCode').textContent='Code '+code;render(d);start()}catch(e){toast('Live Poll noch nicht eingerichtet oder offline');$('#joinBtn').disabled=false}}function start(){clearInterval(timer);timer=setInterval(refresh,1200)}async function refresh(){if(!code)return;try{const d=await rpc('poll_public_state',{p_code:code});if(d&&d.exists)render(d)}catch(e){}}
function render(d){state=d;const q=d.question||{},st=q.status||d.session?.status||'closed';if(q.id!==lastQuestionId){lastQuestionId=q.id||'';selected=null;multiSelected=new Set();ranking=(q.options||[]).map((_,i)=>i);$('#message').classList.add('hidden')}$('#question').textContent=q.prompt||'Keine aktive Frage';$('#status').textContent=st==='open'?'Offen':st==='locked'?'Gesperrt':'Beendet';$('#status').className='status '+(st==='open'?'':st);renderAnswer(q,st);$('#submitBtn').disabled=st!=='open';$('#changeBtn').disabled=st!=='open';$('#resultsWrap').classList.toggle('hidden',!q.reveal_results);if(q.reveal_results)renderResults(q,d.results||{})}
function renderAnswer(q,st){const box=$('#answerArea'),options=Array.isArray(q.options)?q.options:[];
 if(q.question_type==='open'){if(!box.querySelector('#openAnswer')||box.dataset.type!=='open'){box.dataset.type='open';box.innerHTML='<textarea class="open-answer" id="openAnswer" maxlength="300" placeholder="Deine Antwort …"></textarea>'}return}
 if(q.question_type==='wordcloud'){if(!box.querySelector('#wordAnswer')||box.dataset.type!=='wordcloud'){box.dataset.type='wordcloud';box.innerHTML='<input class="open-answer word-input" id="wordAnswer" maxlength="60" placeholder="Ein Begriff …">'}return}
 if(q.question_type==='rating'){box.dataset.type='rating';box.innerHTML='<div class="star-grid">'+[1,2,3,4,5].map((n,i)=>'<button class="star '+(+selected===i?'selected':'')+'" data-star="'+i+'" '+(st==='open'?'':'disabled')+'>★<div style="font-size:10px">'+n+'</div></button>').join('')+'</div>';$$('[data-star]').forEach(b=>b.onclick=()=>{selected=+b.dataset.star;renderAnswer(q,st)});return}
 if(q.question_type==='ranking'){box.dataset.type='ranking';if(!ranking.length)ranking=options.map((_,i)=>i);box.innerHTML='<div class="rank-list">'+ranking.map((idx,pos)=>'<div class="rank-item"><div class="rank-num">'+(pos+1)+'</div><b>'+esc(options[idx])+'</b><div class="rank-actions"><button data-rank-up="'+pos+'" '+(pos===0?'disabled':'')+'>↑</button><button data-rank-down="'+pos+'" '+(pos===ranking.length-1?'disabled':'')+'>↓</button></div></div>').join('')+'</div>';$$('[data-rank-up]').forEach(b=>b.onclick=()=>moveRank(+b.dataset.rankUp,-1,q,st));$$('[data-rank-down]').forEach(b=>b.onclick=()=>moveRank(+b.dataset.rankDown,1,q,st));return}
 box.dataset.type=q.question_type;const multi=q.question_type==='multi';box.innerHTML='<div class="options">'+options.map((o,i)=>'<button class="option '+(multi?multiSelected.has(i):+selected===i?'selected':'')+'" data-letter="'+String.fromCharCode(65+i)+'" data-value="'+i+'" '+(st==='open'?'':'disabled')+'>'+esc(o)+'</button>').join('')+'</div>';$$('[data-value]').forEach(b=>b.onclick=()=>{const i=+b.dataset.value;if(multi){if(multiSelected.has(i))multiSelected.delete(i);else multiSelected.add(i)}else selected=i;renderAnswer(q,st)})
}
function moveRank(pos,dir,q,st){const to=pos+dir;if(to<0||to>=ranking.length)return;[ranking[pos],ranking[to]]=[ranking[to],ranking[pos]];renderAnswer(q,st)}
async function submit(){if(!state?.question||state.question.status!=='open')return;const q=state.question;let av=null,at=null;
 if(q.question_type==='open'){at=$('#openAnswer')?.value.trim()||'';if(!at){toast('Bitte eine Antwort eingeben');return}}
 else if(q.question_type==='wordcloud'){at=$('#wordAnswer')?.value.trim()||'';if(!at){toast('Bitte einen Begriff eingeben');return}}
 else if(q.question_type==='multi'){if(!multiSelected.size){toast('Bitte mindestens eine Antwort auswählen');return}av=JSON.stringify([...multiSelected].sort((a,b)=>a-b))}
 else if(q.question_type==='ranking'){if(!ranking.length){toast('Bitte ein Ranking erstellen');return}av=JSON.stringify(ranking)}
 else{if(selected===null){toast('Bitte eine Antwort auswählen');return}av=String(selected)}
 $('#submitBtn').disabled=true;try{await rpc('poll_submit',{p_code:code,p_voter_token:token(),p_answer_value:av,p_answer_text:at});const m=$('#message');m.textContent='Antwort gespeichert ✓ Du kannst sie ändern, solange die Abstimmung offen ist.';m.className='message ok';await refresh()}catch(e){console.warn(e);const m=$('#message');m.textContent='Antwort konnte nicht gespeichert werden. Die Abstimmung ist eventuell bereits gesperrt.';m.className='message warn'}finally{$('#submitBtn').disabled=state?.question?.status!=='open'}}
function renderResults(q,r){const box=$('#results');
 if(q.question_type==='open'){const arr=Array.isArray(r.answers)?r.answers:[];box.className='answers';box.innerHTML=arr.length?arr.map(a=>'<div class="answer">'+esc(a)+'</div>').join(''):'<div class="answer">Noch keine Antworten.</div>';return}
 if(q.question_type==='wordcloud'){const arr=Array.isArray(r.answers)?r.answers:[],freq={};arr.forEach(x=>String(x||'').toLowerCase().split(/[,;\s]+/).filter(w=>w.length>1).forEach(w=>freq[w]=(freq[w]||0)+1));const words=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,35),max=Math.max(1,...words.map(x=>x[1]));box.className='wordcloud';box.innerHTML=words.map(([w,n])=>'<span style="font-size:'+(13+Math.round(n/max*24))+'px">'+esc(w)+'</span>').join('');return}
 if(q.question_type==='ranking'){const rows=Array.isArray(r.ranking)?r.ranking:[];box.className='ranking';box.innerHTML=rows.map((x,i)=>'<div class="answer"><b>'+(i+1)+'. '+esc(x.label||'')+'</b><span>Ø '+Number(x.average||0).toFixed(1)+'</span></div>').join('');return}
 const options=Array.isArray(q.options)?q.options:[],counts=Array.isArray(r.counts)?r.counts:options.map(()=>0),max=Math.max(1,...counts);box.className='bars';box.innerHTML=options.map((o,i)=>'<div class="bar-row"><div class="answer-key">'+String.fromCharCode(65+i)+'</div><div class="bar-label">'+esc(q.question_type==='rating'?o+' ⭐':o)+'</div><div class="track"><div class="fill" style="width:'+Math.round((counts[i]||0)/max*100)+'%"></div></div><div class="bar-num">'+(counts[i]||0)+'</div></div>').join('')
}
$('#joinBtn').onclick=join;$('#codeInput').addEventListener('keydown',e=>{if(e.key==='Enter')join()});$('#codeInput').oninput=e=>e.target.value=normalizeCode(e.target.value);$('#submitBtn').onclick=submit;$('#changeBtn').onclick=()=>{const q=state?.question;if(q?.question_type==='open')$('#openAnswer')?.focus();else if(q?.question_type==='wordcloud')$('#wordAnswer')?.focus();else toast('Auswahl anpassen und erneut senden')};const q=new URLSearchParams(location.search).get('code');if(q){$('#codeInput').value=normalizeCode(q);join()}if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('../../service-worker.js').catch(()=>{}));})();
</script></body></html>
