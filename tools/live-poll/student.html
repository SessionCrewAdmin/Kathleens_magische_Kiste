<style>

;align-items:center;margin-bottom:10px}.session-code{font-size:10px;color:var(--muted);font-weight:900}.status{font-size:9px;border-radius:999px;padding:5px 8px;font-weight:900;background:#edf8f4;color:#51836e}.status.locked{background:#fff5e8;color:#916a36}.status.closed{background:#f3f0f2;color:#7e727a}.question{font-size:clamp(24px,7vw,38px);line-height:1.12;letter-spacing:-.03em;margin:12px 0 18px}.options{display:grid;gap:9px}.option{border:1px solid var(--line);background:#fffafd;border-radius:15px;padding:14px;text-align:left;font-size:15px;font-weight:850;color:var(--ink);min-height:54px}.option.selected{border-color:#c9add2;background:linear-gradient(135deg,#fff0f7,#f0edff);box-shadow:0 0 0 3px rgba(211,151,188,.13)}.open-answer{width:100%;min-height:110px;border:1px solid var(--line);border-radius:14px;background:#fffafd;padding:12px;color:var(--ink);resize:vertical;font-size:16px}.submit-row{display:flex;gap:8px;margin-top:13px}.submit-row .btn{flex:1}.message{margin-top:12px;border-radius:13px;padding:11px 12px;font-size:11px;font-weight:800;line-height:1.45}.message.ok{background:#edf8f4;color:#4e806c}.message.warn{background:#fff5e8;color:#8f6938}.results{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}.results h2{font-size:14px;margin:0 0 10px}.bars{display:grid;gap:8px}.bar-row{display:grid;grid-template-columns:minmax(90px,1fr) 3fr 36px;gap:7px;align-items:center}.bar-label{font-size:10px;font-weight:850}.track{height:24px;border-radius:8px;background:#f3eaf0;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#d790b5,#aa8cde);border-radius:8px}.bar-num{text-align:right;font-size:10px;font-weight:950}.answers{display:grid;gap:6px}.answer{font-size:10px;line-height:1.4;border:1px solid var(--line);background:#fffafd;border-radius:10px;padding:8px 9px}.footer{text-align:center;font-size:9px;color:var(--muted);margin-top:13px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);z-index:100;background:#684d72;color:#fff;border-radius:999px;padding:10px 14px;font-size:11px;font-weight:850;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}@media(max-width:600px){.shell{padding:10px 9px calc(18px + env(safe-area-inset-bottom))}.top{margin-bottom:10px}.badge{width:46px;height:46px;border-radius:15px;font-size:22px}h1{font-size:24px}.card{padding:14px;border-radius:18px}.question{font-size:28px}.option{font-size:14px;padding:13px}.bar-row{grid-template-columns:80px 1fr 32px}}

body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;pointer-events:none;filter:blur(10px)}
body:before{width:330px;height:330px;left:-120px;top:100px;background:radial-gradient(circle,#ffd9e9,transparent 70%)}

.shell{max-width:820px;padding-top:22px}.badge{background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(240,229,247,.72));border:1px solid rgba(255,255,255,.9);box-shadow:0 14px 36px rgba(96,65,102,.15),inset 0 1px 0 #fff}

.join{padding:22px}.code-input{font-size:32px;padding:16px;border-radius:16px;background:rgba(255,255,255,.78);border-color:rgba(196,173,201,.52);box-shadow:inset 0 1px 0 #fff}.join .btn{min-height:54px;font-size:15px}

.submit-row{margin-top:16px}.submit-row .btn{min-height:52px}.message.ok{background:linear-gradient(135deg,#e9f8f1,#f4fbf8);border:1px solid #cfe9dc;animation:successPop .28s ease}@keyframes successPop{50%{transform:scale(1.02)}}.results{margin-top:20px}.bar-row{grid-template-columns:32px 82px 1fr 38px}.answer-key{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:10px;font-weight:1000;color:#fff;background:linear-gradient(135deg,#d98ab3,#a88ddd)}.bar-pct{font-size:9px;font-weight:950;color:#88758d;text-align:right}.track{height:28px;border-radius:10px}.fill{box-shadow:0 5px 14px rgba(164,113,173,.17)}.answer{background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(251,246,252,.78));border-radius:13px;padding:11px 12px;box-shadow:0 7px 18px rgba(90,61,95,.06)}

</style></head><body><main class="shell"><header class="top"><div class="badge">📊</div><h1>Live Poll</h1><p class="sub">Anonym teilnehmen · keine Anmeldung nötig. · Glass UI</p></header>
<section class="card join" id="joinCard"><label class="label">Session-Code</label><input class="code-input" id="codeInput" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABC123"><button class="btn primary" id="joinBtn">Teilnehmen</button></section>

<script>
(()=>{const SUPABASE_URL='https://fzqxnjhuvgpgovcovosl.supabase.co',SUPABASE_KEY='sb_publishable_GIyyWoyaQXipaA4S9OuTyQ_cZn7LUgV';const $=s=>document.querySelector(s);let code='',state=null,selected=null,lastQuestionId='',timer=null;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1700)}async function rpc(name,body={}){const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(name+' '+r.status+' '+await r.text());const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():null}function token(){let t=localStorage.getItem('kathleenPollVoterToken');if(!t){t=(crypto.randomUUID?crypto.randomUUID():'v-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));localStorage.setItem('kathleenPollVoterToken',t)}return t}function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]))}function normalizeCode(v){return String(v||'').toUpperCase().replace(/[^A-F0-9]/g,'').slice(0,6)}async function join(){code=normalizeCode($('#codeInput').value);if(code.length!==6){toast('Bitte 6-stelligen Code eingeben');return}$('#joinBtn').disabled=true;try{const d=await rpc('poll_public_state',{p_code:code});if(!d||!d.exists){toast('Session nicht gefunden');$('#joinBtn').disabled=false;return}$('#joinCard').classList.add('hidden');$('#pollCard').classList.add('show');$('#sessionCode').textContent='Code '+code;render(d);start()}catch(e){toast('Live Poll noch nicht eingerichtet oder offline');$('#joinBtn').disabled=false}}function start(){clearInterval(timer);timer=setInterval(refresh,1400)}async function refresh(){if(!code)return;try{const d=await rpc('poll_public_state',{p_code:code});if(d&&d.exists)render(d)}catch(e){}}function render(d){state=d;const q=d.question||{},st=q.status||d.session?.status||'closed';if(q.id!==lastQuestionId){lastQuestionId=q.id||'';selected=null;$('#message').classList.add('hidden')}$('#question').textContent=q.prompt||'Keine aktive Frage';$('#status').textContent=st==='open'?'Offen':st==='locked'?'Gesperrt':'Beendet';$('#status').className='status '+(st==='open'?'':st);renderAnswer(q,st);$('#submitBtn').disabled=st!=='open';$('#changeBtn').disabled=st!=='open';$('#resultsWrap').classList.toggle('hidden',!q.reveal_results);if(q.reveal_results)renderResults(q,d.results||{})}function renderAnswer(q,st){const box=$('#answerArea');if(q.question_type==='open'){if(!box.querySelector('textarea'))box.innerHTML='<textarea class="open-answer" id="openAnswer" maxlength="300" placeholder="Deine Antwort …"></textarea>';return}const options=Array.isArray(q.options)?q.options:[];box.innerHTML='<div class="options">'+options.map((o,i)=>'<button class="option '+(String(selected)===String(i)?'selected':'')+'" data-letter="'+String.fromCharCode(65+i)+'" data-value="'+i+'" '+(st==='open'?'':'disabled')+'>'+esc(o)+'</button>').join('')+'</div>';document.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{selected=b.dataset.value;document.querySelectorAll('[data-value]').forEach(x=>x.classList.toggle('selected',x===b))})}async function submit(){if(!state?.question||state.question.status!=='open')return;const q=state.question;let av=null,at=null;if(q.question_type==='open'){at=$('#openAnswer')?.value.trim()||'';if(!at){toast('Bitte eine Antwort eingeben');return}}else{if(selected===null){toast('Bitte eine Antwort auswählen');return}av=String(selected)}$('#submitBtn').disabled=true;try{await rpc('poll_submit',{p_code:code,p_voter_token:token(),p_answer_value:av,p_answer_text:at});const m=$('#message');m.textContent='Antwort gespeichert ✓ Du kannst sie ändern, solange die Abstimmung offen ist.';m.className='message ok';await refresh()}catch(e){const m=$('#message');m.textContent='Antwort konnte nicht gespeichert werden. Die Abstimmung ist eventuell bereits gesperrt.';m.className='message warn'}finally{$('#submitBtn').disabled=state?.question?.status!=='open'}}function renderResults(q,r){const box=$('#results');if(q.question_type==='open'){const arr=Array.isArray(r.answers)?r.answers:[];box.className='answers';box.innerHTML=arr.length?arr.map(a=>'<div class="answer">'+esc(a)+'</div>').join(''):'<div class="answer">Noch keine Antworten.</div>';return}const options=Array.isArray(q.options)?q.options:[],counts=Array.isArray(r.counts)?r.counts:options.map(()=>0),max=Math.max(1,...counts);box.className='bars';const total=Math.max(0,counts.reduce((a,b)=>a+(Number(b)||0),0));box.innerHTML=options.map((o,i)=>{const pct=total?Math.round((counts[i]||0)/total*100):0;return '<div class="bar-row"><div class="answer-key">'+String.fromCharCode(65+i)+'</div><div class="bar-label">'+esc(o)+'</div><div class="track"><div class="fill" style="width:'+Math.round((counts[i]||0)/max*100)+'%"></div></div><div class="bar-pct">'+pct+'%</div></div>'}).join('')}$('#joinBtn').onclick=join;$('#codeInput').addEventListener('keydown',e=>{if(e.key==='Enter')join()});$('#codeInput').oninput=e=>e.target.value=normalizeCode(e.target.value);$('#submitBtn').onclick=submit;$('#changeBtn').onclick=()=>{if(state?.question?.question_type==='open')$('#openAnswer')?.focus();else toast('Neue Auswahl treffen und erneut senden')};const q=new URLSearchParams(location.search).get('code');if(q){$('#codeInput').value=normalizeCode(q);join()}if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('../../service-worker.js').catch(()=>{}));})();
</script></body></html>
