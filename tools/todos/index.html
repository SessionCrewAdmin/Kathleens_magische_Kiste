<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf6fb">
<title>To-dos · Kathleens Kiste</title>
<link rel="stylesheet" href="../teacher-design-v50.css?v=20260923-v68">
<link rel="stylesheet" href="../teacher-page-adapters-v50.css?v=20260923-v68">
<link rel="stylesheet" href="../teacher-premium-pages-v57.css?v=20260923-v68">
<style>
:root{--ink:#55455e;--muted:#85788e;--line:#e8dfe9;--paper:#fffdfd;--rose:#c985a6;--purple:#a08abb;--mint:#dceee5;--shadow:0 12px 34px rgba(91,67,98,.09)}
*{box-sizing:border-box}body{margin:0;background:#f8f3f8;color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif}.todo-page{max-width:1440px;margin:0 auto;padding:24px 28px 42px}.todo-hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;padding:22px 24px;border:1px solid var(--line);border-radius:20px;background:radial-gradient(circle at 88% 0,#eee7f7,transparent 34%),radial-gradient(circle at 0 100%,#fcecf3,transparent 34%),var(--paper);box-shadow:var(--shadow)}.eyebrow{font-size:9px;font-weight:950;letter-spacing:.14em;color:#9b8099}.todo-hero h1{margin:4px 0 7px;font:700 36px/1 Georgia,"Times New Roman",serif;letter-spacing:-.03em}.todo-hero p{margin:0;max-width:760px;color:var(--muted);font-size:11px;line-height:1.55}.hero-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--line);border-radius:11px;background:#fff;color:#66536d;padding:10px 12px;font-size:10px;font-weight:900;cursor:pointer}.btn.primary{border:0;background:linear-gradient(120deg,#ca87ab,#a08abb);color:#fff}.btn:disabled{opacity:.5}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:13px 0}.stat{padding:14px 15px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 5px 16px rgba(91,67,98,.04)}.stat span{display:block;color:var(--muted);font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.stat strong{display:block;margin-top:4px;font:700 30px Georgia,serif}.controls{display:grid;grid-template-columns:minmax(240px,1fr) repeat(3,minmax(130px,190px));gap:8px;padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff}.controls input,.controls select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:9px 11px;outline:none}.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.filter-tabs button{border:1px solid var(--line);border-radius:999px;background:#fff;color:#7d6b82;padding:7px 10px;font-size:9px;font-weight:900}.filter-tabs button.active{background:#715979;color:#fff;border-color:#715979}.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:12px;align-items:start}.board{display:grid;gap:12px}.group{border:1px solid var(--line);border-radius:17px;background:var(--paper);overflow:hidden}.group-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #eee5ef;background:#fcf9fc}.group-head h2{margin:0;font-size:12px}.group-head span{font-size:8px;color:var(--muted);font-weight:900}.list{display:grid;gap:0}.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 14px;border-bottom:1px solid #f0e8f0;background:#fff}.row:last-child{border-bottom:0}.row.overdue{background:#fff9fa}.row.high{box-shadow:inset 3px 0 #c6677b}.row.low{opacity:.82}.row.done{opacity:.58}.row.done .task-title{text-decoration:line-through}.check{margin-top:2px;width:20px;height:20px;accent-color:#a889bb}.task-title{font-size:11px;font-weight:900;line-height:1.35}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.meta span{padding:4px 6px;border-radius:999px;background:#f7f1f7;color:#7e6d83;font-size:7px;font-weight:850}.meta .danger{background:#fff0f3;color:#a35468}.row-tools{display:flex;gap:2px}.icon-btn{width:30px;height:30px;border:0;border-radius:9px;background:#faf6fb;color:#806d84;cursor:pointer}.empty{padding:34px 15px;text-align:center;color:var(--muted);font-size:10px}.editor{position:sticky;top:84px;padding:16px;border:1px solid var(--line);border-radius:17px;background:var(--paper);box-shadow:0 7px 24px rgba(91,67,98,.05)}.editor h2{margin:0;font:700 21px Georgia,serif}.editor>p{margin:4px 0 13px;color:var(--muted);font-size:9px}.field{display:block;margin-top:9px}.field span{display:block;margin-bottom:5px;font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#88768e}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 10px;color:var(--ink);outline:none}.field textarea{min-height:84px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.class-box{max-height:118px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;padding:7px}.class-box label{display:flex;align-items:center;gap:7px;padding:6px;border-radius:8px;font-size:9px}.class-box label:hover{background:#faf6fb}.form-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}.hint{margin-top:8px;min-height:14px;color:#9b5667;font-size:8px;font-weight:800}.hidden{display:none!important}.sync-state{margin-top:8px;color:var(--muted);font-size:8px}.sync-state.ok{color:#53806b}.sync-state.bad{color:#a45868}@media(max-width:1050px){.layout{grid-template-columns:1fr}.editor{position:static;order:-1}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.todo-page{padding:14px 10px 94px}.todo-hero{display:block;padding:17px}.hero-actions{justify-content:flex-start;margin-top:12px}.controls{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.row{padding:11px 10px}.editor input,.editor select,.editor textarea,.controls input,.controls select{font-size:16px}}
</style>
</head>
<body>
<main class="todo-page">
<section class="todo-hero"><div><div class="eyebrow">MEINE KISTE · ORGANISATION</div><h1>Meine To-dos</h1><p>Alle Aufgaben an einem Ort – nach Termin, Klasse, Fach und Priorität. Änderungen erscheinen automatisch auch im To-do-Widget auf der Startseite.</p></div><div class="hero-actions"><button class="btn" id="syncBtn">☁︎ Synchronisieren</button><button class="btn primary" id="newBtn">＋ Neues To-do</button></div></section>
<section class="stats"><div class="stat"><span>Offen</span><strong id="statOpen">0</strong></div><div class="stat"><span>Heute</span><strong id="statToday">0</strong></div><div class="stat"><span>Überfällig</span><strong id="statOverdue">0</strong></div><div class="stat"><span>Erledigt</span><strong id="statDone">0</strong></div></section>
<section class="controls"><input id="search" placeholder="To-dos durchsuchen …"><select id="classFilter"><option value="all">Alle Klassen</option></select><select id="subjectFilter"><option value="all">Alle Fächer</option></select><select id="priorityFilter"><option value="all">Alle Prioritäten</option><option value="high">Hoch</option><option value="normal">Normal</option><option value="low">Niedrig</option></select></section>
<div class="filter-tabs" id="tabs"><button class="active" data-filter="open">Offen</button><button data-filter="today">Heute</button><button data-filter="upcoming">Demnächst</button><button data-filter="overdue">Überfällig</button><button data-filter="done">Erledigt</button><button data-filter="all">Alle</button></div>
<section class="layout"><div class="board" id="board"></div><aside class="editor hidden" id="editor"><h2 id="editorTitle">Neues To-do</h2><p>Aufgabe anlegen oder bestehende Aufgabe bearbeiten.</p><label class="field"><span>Aufgabe</span><textarea id="text" maxlength="300" placeholder="Was steht an?"></textarea></label><div class="two"><label class="field"><span>Fach</span><input id="subject" list="subjects" placeholder="z. B. Englisch"><datalist id="subjects"><option value="Englisch"><option value="Geschichte"></datalist></label><label class="field"><span>Termin</span><input id="due" type="datetime-local"></label></div><div class="two"><label class="field"><span>Priorität</span><select id="priority"><option value="normal">Normal</option><option value="high">Hoch</option><option value="low">Niedrig</option></select></label><label class="field"><span>Wiederholung</span><select id="repeat"><option value="none">Einmalig</option><option value="daily">Täglich</option><option value="weekdays">Werktags</option><option value="weekly">Wöchentlich</option></select></label></div><label class="field"><span>Klassen</span><div class="class-box" id="classes"></div></label><label class="field"><span>Erinnerung</span><select id="push"><option value="0">Keine Push-Erinnerung</option><option value="1">Push zum Termin</option></select></label><div class="form-actions"><button class="btn" id="cancelBtn">Abbrechen</button><button class="btn primary" id="saveBtn">Speichern</button></div><div class="hint" id="hint"></div><div class="sync-state" id="syncState"></div></aside></section>
</main>
<script src="../classroom-tools-shared.js?v=20260923-v68"></script>
<script src="../todo-store.js?v=20260923-v68"></script>
<script src="../teacher-shell.js?v=20260923-v68"></script>
<script>
(()=>{'use strict';
const EDGE='https://fzqxnjhuvgpgovcovosl.supabase.co/functions/v1/teacher-push',SB='https://fzqxnjhuvgpgovcovosl.supabase.co/rest/v1/rpc/',API='sb_publishable_GIyyWoyaQXipaA4S9OuTyQ_cZn7LUgV';
let filter='open',editing='',pushToken=sessionStorage.getItem('kathleenPushAdminToken')||'';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const pad=n=>String(n).padStart(2,'0'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function load(){return window.KathleenTodoStore?.load?.()||[]}
async function save(a){if(window.KathleenTodoStore)return window.KathleenTodoStore.save(a);localStorage.setItem('kathleen-home-todos-v1',JSON.stringify(a));return a}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function state(x){if(x.done)return'done';if(!x.due)return'open';const d=new Date(x.due),n=new Date(),tom=new Date(n);tom.setDate(n.getDate()+1);if(d<n)return'overdue';if(dateKey(d)===dateKey(n))return'today';if(dateKey(d)===dateKey(tom))return'tomorrow';return'future'}
function dueText(v){if(!v)return'Ohne Termin';const d=new Date(v);return d.toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function toInput(v){if(!v)return'';const d=new Date(v);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function classes(){try{const live=window.KathleenClassLists?.classMeta?.();if(Array.isArray(live)&&live.length)return live}catch(e){}try{const a=JSON.parse(localStorage.getItem('kathleenClassMetaV1')||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function selectedClasses(){return[...$('#classes').querySelectorAll('input:checked')].map(i=>({id:i.value,name:i.dataset.name}))}
function filters(){const q=$('#search').value.trim().toLocaleLowerCase('de'),cf=$('#classFilter').value,sf=$('#subjectFilter').value,pf=$('#priorityFilter').value;return load().filter(x=>{const st=state(x),matchFilter=filter==='all'||(filter==='open'&&!x.done)||(filter==='today'&&st==='today')||(filter==='upcoming'&&['tomorrow','future'].includes(st))||(filter==='overdue'&&st==='overdue')||(filter==='done'&&x.done);const names=x.classNames||[];return matchFilter&&(!q||[x.text,x.subject,...names].join(' ').toLocaleLowerCase('de').includes(q))&&(cf==='all'||(x.classIds||[]).map(String).includes(cf))&&(sf==='all'||x.subject===sf)&&(pf==='all'||x.priority===pf)})}
function groupKey(x){const st=state(x);return st==='overdue'?'overdue':st==='today'?'today':st==='tomorrow'?'tomorrow':st==='done'?'done':x.due?'future':'none'}
const GROUPS=[['overdue','Überfällig'],['today','Heute'],['tomorrow','Morgen'],['future','Später'],['none','Ohne Termin'],['done','Erledigt']];
function render(){const all=load(),n=new Date();$('#statOpen').textContent=all.filter(x=>!x.done).length;$('#statToday').textContent=all.filter(x=>state(x)==='today').length;$('#statOverdue').textContent=all.filter(x=>state(x)==='overdue').length;$('#statDone').textContent=all.filter(x=>x.done).length;const arr=filters().sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;if(a.priority!==b.priority)return ({high:0,normal:1,low:2}[a.priority]??1)-({high:0,normal:1,low:2}[b.priority]??1);return (a.due||'9999').localeCompare(b.due||'9999')});const board=$('#board');if(!arr.length){board.innerHTML='<div class="group"><div class="empty">Keine passenden To-dos.</div></div>';return}board.innerHTML=GROUPS.map(([key,title])=>{const xs=arr.filter(x=>groupKey(x)===key);if(!xs.length)return'';return '<section class="group"><div class="group-head"><h2>'+title+'</h2><span>'+xs.length+' Aufgabe'+(xs.length===1?'':'n')+'</span></div><div class="list">'+xs.map(rowHtml).join('')+'</div></section>'}).join('');board.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>toggle(c.dataset.check,c.checked));board.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(load().find(x=>x.id===b.dataset.edit)));board.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove(b.dataset.del))}
function rowHtml(x){const st=state(x),tags=[];if(x.due)tags.push('<span class="'+(st==='overdue'?'danger':'')+'">'+esc(dueText(x.due))+'</span>');if(x.subject)tags.push('<span>'+esc(x.subject)+'</span>');for(const n of (x.classNames||[]))tags.push('<span>'+esc(n)+'</span>');if(x.repeat&&x.repeat!=='none')tags.push('<span>↻ '+esc({daily:'täglich',weekdays:'werktags',weekly:'wöchentlich'}[x.repeat]||x.repeat)+'</span>');if(x.push)tags.push('<span>🔔</span>');return '<article class="row '+esc(st)+' '+esc(x.priority||'normal')+' '+(x.done?'done':'')+'"><input class="check" type="checkbox" data-check="'+esc(x.id)+'" '+(x.done?'checked':'')+'><div><div class="task-title">'+esc(x.text)+'</div><div class="meta">'+tags.join('')+'</div></div><div class="row-tools"><button class="icon-btn" title="Bearbeiten" data-edit="'+esc(x.id)+'">✎</button><button class="icon-btn" title="Löschen" data-del="'+esc(x.id)+'">×</button></div></article>'}
function populateFilters(){const cs=classes();$('#classFilter').innerHTML='<option value="all">Alle Klassen</option>'+cs.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('');const subs=[...new Set(load().map(x=>x.subject).filter(Boolean))].sort();$('#subjectFilter').innerHTML='<option value="all">Alle Fächer</option>'+subs.map(s=>'<option>'+esc(s)+'</option>').join('')}
function openEditor(item=null){editing=item?.id||'';$('#editor').classList.remove('hidden');$('#editorTitle').textContent=item?'To-do bearbeiten':'Neues To-do';$('#text').value=item?.text||'';$('#subject').value=item?.subject||'';$('#due').value=toInput(item?.due);$('#priority').value=item?.priority||'normal';$('#repeat').value=item?.repeat||'none';$('#push').value=item?.push?'1':'0';const ids=new Set((item?.classIds||[]).map(String));$('#classes').innerHTML=classes().map(c=>'<label><input type="checkbox" value="'+esc(c.id)+'" data-name="'+esc(c.name)+'" '+(ids.has(String(c.id))?'checked':'')+'> '+esc(c.name)+'</label>').join('')||'<div style="font-size:9px;color:var(--muted);padding:6px">Noch keine Klassenliste vorhanden.</div>';$('#hint').textContent='';setTimeout(()=>$('#text').focus(),30)}
function closeEditor(){$('#editor').classList.add('hidden');editing=''}
async function rpc(name,body){const r=await fetch(SB+name,{method:'POST',headers:{apikey:API,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return r.json()}
async function issueToken(){let pass=sessionStorage.getItem('kathleenAdminPass')||'';if(!pass){pass=prompt('Kisten-Adminpasswort für Push-Erinnerungen:')||'';if(!pass)throw Error('Push nicht eingerichtet')}const t=await rpc('teacher_push_issue_token',{p_passphrase:pass});if(!t)throw Error('Admin-Passwort falsch');sessionStorage.setItem('kathleenAdminPass',pass);pushToken=String(t);sessionStorage.setItem('kathleenPushAdminToken',pushToken);return pushToken}
async function pushCall(action,payload={},retry=true){if(!pushToken)await issueToken();const r=await fetch(EDGE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...payload,adminToken:pushToken})});let d={};try{d=await r.json()}catch(e){}if(r.status===401&&retry){pushToken='';sessionStorage.removeItem('kathleenPushAdminToken');await issueToken();return pushCall(action,payload,false)}if(!r.ok||d?.ok===false)throw Error(d?.error||('HTTP '+r.status));return d}
async function cancelReminder(x){if(!x?.pushReminderId)return;try{await pushCall('cancel',{id:x.pushReminderId})}catch(e){}x.pushReminderId=''}
async function scheduleReminder(x){if(!x.push||!x.due||new Date(x.due)<=new Date())return'';const r=await pushCall('schedule',{title:'To-do: '+x.text,body:[(x.classNames||[]).join(', '),x.subject].filter(Boolean).join(' · ')||'Kathleens Kiste',scheduledFor:new Date(x.due).toISOString(),recurrence:x.repeat,url:'./tools/todos/',timezone:'Europe/Berlin'});return String(r.id||'')}
async function saveEditor(){const text=$('#text').value.trim();if(!text){$('#hint').textContent='Bitte eine Aufgabe eingeben.';return}const all=load(),old=editing?all.find(x=>x.id===editing):null,cs=selectedClasses(),raw=$('#due').value,item={...(old||{}),id:old?.id||uid(),text,done:old?.done||false,classIds:cs.map(x=>x.id),classNames:cs.map(x=>x.name),classId:cs[0]?.id||'',className:cs[0]?.name||'',subject:$('#subject').value.trim(),due:raw?new Date(raw).toISOString():'',priority:$('#priority').value,repeat:$('#repeat').value,push:$('#push').value==='1',createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};$('#saveBtn').disabled=true;try{if(old?.pushReminderId)await cancelReminder(old);if(item.push&&item.due)item.pushReminderId=await scheduleReminder(item);const next=old?all.map(x=>x.id===item.id?item:x):[item,...all];await save(next);closeEditor();populateFilters();render()}catch(e){$('#hint').textContent='Speichern fehlgeschlagen: '+(e.message||'Fehler')}finally{$('#saveBtn').disabled=false}}
function nextDue(v,repeat){const d=new Date(v||Date.now());if(repeat==='daily')d.setDate(d.getDate()+1);else if(repeat==='weekly')d.setDate(d.getDate()+7);else if(repeat==='weekdays'){do{d.setDate(d.getDate()+1)}while([0,6].includes(d.getDay()))}return d.toISOString()}
async function toggle(id,done){const all=load(),x=all.find(t=>t.id===id);if(!x)return;if(done&&x.repeat&&x.repeat!=='none'){if(x.pushReminderId)await cancelReminder(x);const copy={...x,id:uid(),done:false,due:nextDue(x.due,x.repeat),pushReminderId:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};if(copy.push)try{copy.pushReminderId=await scheduleReminder(copy)}catch(e){}x.done=true;x.updatedAt=new Date().toISOString();await save([copy,...all])}else{x.done=done;x.updatedAt=new Date().toISOString();await save(all)}populateFilters();render()}
async function remove(id){const all=load(),x=all.find(t=>t.id===id);if(!x||!confirm('To-do wirklich löschen?'))return;if(x.pushReminderId)await cancelReminder(x);await save(all.filter(t=>t.id!==id));populateFilters();render()}
async function sync(){const b=$('#syncBtn'),s=$('#syncState');if(!window.KathleenTodoStore)return;b.disabled=true;b.textContent='☁︎ …';let pass=sessionStorage.getItem('kathleenAdminPass')||'';if(!pass)pass=prompt('Kisten-Adminpasswort für die verschlüsselte Cloud-Sicherung:')||'';if(!pass){b.disabled=false;b.textContent='☁︎ Synchronisieren';return}sessionStorage.setItem('kathleenAdminPass',pass);try{const remote=await window.KathleenTodoStore.cloudPull(pass),merged=window.KathleenTodoStore.merge(load(),remote);await window.KathleenTodoStore.save(merged);await window.KathleenTodoStore.cloudPush(merged,pass);s.textContent='Cloud-Sync abgeschlossen.';s.className='sync-state ok';populateFilters();render()}catch(e){sessionStorage.removeItem('kathleenAdminPass');s.textContent='Sync fehlgeschlagen – Adminpasswort prüfen.';s.className='sync-state bad'}finally{b.disabled=false;b.textContent='☁︎ Synchronisieren'}}
function init(){populateFilters();render();$('#newBtn').onclick=()=>openEditor();$('#cancelBtn').onclick=closeEditor;$('#saveBtn').onclick=saveEditor;$('#syncBtn').onclick=sync;$('#search').oninput=render;$('#classFilter').onchange=render;$('#subjectFilter').onchange=render;$('#priorityFilter').onchange=render;$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()});window.addEventListener('kathleen:todos',()=>{populateFilters();render()});window.addEventListener('kathleen:todos-ready',()=>{populateFilters();render()})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
</body>
</html>
