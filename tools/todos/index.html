<style>

*{box-sizing:border-box}body{margin:0;background:#f8f3f8;color:var(--td-ink);font-family:Inter,"Segoe UI",system-ui,sans-serif}.todo69{max-width:1480px;margin:0 auto;padding:24px 28px 42px}.todo69-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:21px 23px;border:1px solid var(--td-line);border-radius:20px;background:radial-gradient(circle at 92% 0,#eee7f7,transparent 35%),radial-gradient(circle at 0 100%,#fcecf3,transparent 35%),var(--td-paper);box-shadow:var(--td-shadow)}.todo69-kicker{font-size:9px;font-weight:950;letter-spacing:.14em;color:#9b8099}.todo69-hero h1{margin:4px 0 6px;font:700 36px/1 Georgia,"Times New Roman",serif;letter-spacing:-.03em}.todo69-hero p{max-width:730px;margin:0;color:var(--td-muted);font-size:11px;line-height:1.55}.todo69-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.todo69-btn{min-height:40px;border:1px solid var(--td-line);border-radius:11px;background:#fff;color:#68576e;padding:9px 12px;font-size:10px;font-weight:900;cursor:pointer}.todo69-btn.primary{border:0;background:linear-gradient(120deg,#ca87ab,#a08abb);color:#fff}.todo69-btn:disabled{opacity:.55}.todo69-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.todo69-stat{padding:12px 14px;border:1px solid var(--td-line);border-radius:14px;background:#fff}.todo69-stat span{display:block;color:var(--td-muted);font-size:8px;font-weight:950;text-transform:uppercase;letter-spacing:.09em}.todo69-stat strong{display:block;margin-top:2px;font:700 26px Georgia,serif}.todo69-toolbar{display:grid;grid-template-columns:minmax(230px,1fr) repeat(3,minmax(130px,180px));gap:7px;padding:10px;border:1px solid var(--td-line);border-radius:15px;background:#fff}.todo69-toolbar input,.todo69-toolbar select{width:100%;min-height:40px;border:1px solid var(--td-line);border-radius:10px;background:#fff;color:var(--td-ink);padding:8px 10px;outline:none}.todo69-tabs{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0 11px}.todo69-tabs button{border:1px solid var(--td-line);border-radius:999px;background:#fff;color:#7c6981;padding:7px 10px;font-size:9px;font-weight:900;cursor:pointer}.todo69-tabs button.active{background:#705978;color:#fff;border-color:#705978}.todo69-layout{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:12px;align-items:start}.todo69-list-pane,.todo69-detail{border:1px solid var(--td-line);border-radius:18px;background:var(--td-paper);box-shadow:0 5px 18px rgba(91,67,98,.04);overflow:hidden}.todo69-list-head{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid #eee5ef}.todo69-list-head h2{margin:0;font:700 18px Georgia,serif}.todo69-list-head span{font-size:9px;color:var(--td-muted);font-weight:850}.todo69-list{display:grid}.todo69-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:start;padding:13px 14px;border-bottom:1px solid #f0e8f0;background:#fff;cursor:pointer;transition:.15s}.todo69-row:last-child{border-bottom:0}.todo69-row:hover{background:#fdfafd}.todo69-row.active{background:#f6eef9;box-shadow:inset 3px 0 #a88dbc}.todo69-row.overdue{box-shadow:inset 3px 0 #d58a9b}.todo69-row.overdue.active{box-shadow:inset 3px 0 #a88dbc}.todo69-row.done{opacity:.58}.todo69-row.done .todo69-rowtitle{text-decoration:line-through}.todo69-check,.todo69-circle{display:grid;place-items:center;border:1.5px solid #a998ac;border-radius:50%;background:#fff;color:#fff;cursor:pointer}.todo69-check{width:22px;height:22px;margin-top:1px}.todo69-check.checked,.todo69-circle.done{background:#8e76a5;border-color:#8e76a5}.todo69-rowtitle{font-size:11px;font-weight:900;line-height:1.4}.todo69-rowmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.todo69-rowmeta span{padding:3px 6px;border-radius:999px;background:#f7f1f7;color:#7e6d83;font-size:7px;font-weight:850}.todo69-rowmeta span.danger{background:#fff0f3;color:#a65769}.todo69-star,.todo69-bigstar{border:0;background:transparent;color:#a996ac;cursor:pointer}.todo69-star{width:30px;height:30px;font-size:21px}.todo69-star.on,.todo69-bigstar.on{color:#c38c42}.todo69-empty{display:grid;place-items:center;gap:5px;min-height:240px;color:var(--td-muted);text-align:center}.todo69-empty strong{color:#6d5b72;font-size:12px}.todo69-empty span{font-size:9px}.todo69-detail{position:sticky;top:82px;max-height:calc(100vh - 102px);overflow:auto}.todo69-detail.empty{min-height:480px}.todo69-detail-empty{min-height:480px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--td-muted);text-align:center;padding:30px}.todo69-detail-empty div{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:#f2eaf6;color:#9c82af;font-size:24px}.todo69-detail-empty strong{color:#66536d}.todo69-detail-empty span{max-width:240px;font-size:9px;line-height:1.45}.todo69-detail-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:9px;align-items:start;padding:15px;border-bottom:1px solid var(--td-line);background:#fff}.todo69-circle{width:24px;height:24px;margin-top:3px}.todo69-detail-top textarea{width:100%;min-height:34px;max-height:120px;border:0;outline:0;resize:none;background:transparent;color:var(--td-ink);font:800 17px/1.35 Inter,system-ui,sans-serif;overflow:hidden}.todo69-bigstar{font-size:26px;line-height:30px}.todo69-close{display:none;border:0;background:#f7f1f7;border-radius:9px;width:31px;height:31px;color:#76647b;font-size:18px}.todo69-section{padding:13px 15px;border-bottom:1px solid var(--td-line);background:#fff}.todo69-section-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:8px}.todo69-section-head strong{font-size:10px}.todo69-section-head span,.todo69-section-head a{font-size:8px;color:var(--td-muted);text-decoration:none}.todo69-steps{display:grid;gap:4px}.todo69-step{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:7px;min-height:37px}.todo69-step input[type=checkbox]{width:17px;height:17px;accent-color:#9d84b3}.todo69-steptext{border:0;border-bottom:1px solid transparent;background:transparent;color:var(--td-ink);padding:6px 2px;font-size:10px;outline:0}.todo69-steptext:focus{border-bottom-color:#d8c9df}.todo69-step.done .todo69-steptext{text-decoration:line-through;color:#a495a7}.todo69-step button,.todo69-material button{border:0;background:transparent;color:#a48ea5;font-size:15px;cursor:pointer}.todo69-addline{display:grid;grid-template-columns:20px 1fr;gap:6px;align-items:center;margin-top:5px;color:#9a80a1}.todo69-addline input{border:0;outline:0;background:transparent;padding:7px 2px;color:var(--td-ink);font-size:10px}.todo69-properties{display:grid;gap:6px}.todo69-properties label{display:grid;grid-template-columns:28px 1fr;align-items:center;min-height:39px;border:1px solid #eee5ef;border-radius:10px;background:#fffdfd}.todo69-properties label>span{text-align:center;font-size:12px;color:#8e7993}.todo69-properties input,.todo69-properties select{min-width:0;width:100%;border:0;background:transparent;padding:8px 8px 8px 0;color:var(--td-ink);outline:0;font-size:9px}.todo69-classes{display:flex;gap:5px;flex-wrap:wrap}.todo69-classcheck{display:inline-flex;align-items:center;gap:5px;padding:6px 8px;border:1px solid var(--td-line);border-radius:999px;background:#fffafd;font-size:8px}.todo69-classcheck input{accent-color:#9c84b2}.todo69-materials{display:grid;gap:5px}.todo69-material{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:7px;padding:7px;border:1px solid #eee5ef;border-radius:10px;background:#fffdfd}.todo69-fileicon{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#f1e9f5;color:#826c8b}.todo69-material a{min-width:0;color:var(--td-ink);text-decoration:none}.todo69-material b,.todo69-material small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.todo69-material b{font-size:9px}.todo69-material small{margin-top:2px;color:var(--td-muted);font-size:7px}.todo69-material-add{display:grid;grid-template-columns:1fr 1.3fr auto;gap:5px;margin-top:7px}.todo69-material-add input{min-width:0;border:1px solid var(--td-line);border-radius:9px;background:#fff;padding:8px;font-size:9px;outline:0}.todo69-material-add button{border:0;border-radius:9px;background:#eee5f3;color:#765d82;width:34px;font-weight:900}.todo69-material-hint{margin-top:5px;color:var(--td-muted);font-size:7px}.todo69-notes{width:100%;min-height:100px;border:1px solid var(--td-line);border-radius:10px;background:#fffafd;padding:9px;color:var(--td-ink);resize:vertical;outline:0;font-size:10px;line-height:1.5}.todo69-detail-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 15px;background:#fcf9fc}.todo69-detail-foot span{color:var(--td-muted);font-size:7px}.todo69-detail-foot button{border:0;background:transparent;color:#ae5c6c;font-size:8px;font-weight:900;cursor:pointer}.todo69-sync-state{min-height:14px;margin-top:7px;color:var(--td-muted);font-size:8px}.todo69-muted{font-size:8px;color:var(--td-muted)}
@media(max-width:1050px){.todo69-layout{grid-template-columns:minmax(0,1fr) 380px}.todo69-toolbar{grid-template-columns:1fr 1fr}.todo69-stats{grid-template-columns:repeat(4,1fr)}}
@media(max-width:760px){.todo69{padding:13px 9px 92px}.todo69-hero{display:block;padding:16px}.todo69-hero h1{font-size:29px}.todo69-actions{justify-content:flex-start;margin-top:11px}.todo69-stats{grid-template-columns:1fr 1fr}.todo69-toolbar{grid-template-columns:1fr}.todo69-layout{display:block}.todo69-detail{display:none;position:fixed;z-index:30000;inset:0;max-height:none;border:0;border-radius:0;padding-top:env(safe-area-inset-top);background:#f8f3f8}.todo69-detail-open .todo69-detail:not(.empty){display:block}.todo69-close{display:block}.todo69-detail-top{position:sticky;top:0;z-index:2}.todo69-material-add{grid-template-columns:1fr}.todo69-material-add button{width:100%;min-height:39px}.todo69-toolbar input,.todo69-toolbar select,.todo69-detail input,.todo69-detail select,.todo69-detail textarea{font-size:16px}.todo69-rowtitle{font-size:13px}}
</style>

<body>
<main class="todo69">
<section class="todo69-hero"><div><div class="todo69-kicker">MEINE KISTE · ORGANISATION</div><h1>Meine To-dos</h1><p>Aufgaben wie in einer persönlichen Aufgaben-App verwalten – mit Schritten, Unterrichtsmaterial, Notizen, Klassenbezug und Erinnerungen.</p></div><div class="todo69-actions"><button class="todo69-btn" id="syncBtn">☁︎ Synchronisieren</button><button class="todo69-btn primary" id="newBtn">＋ Neue Aufgabe</button></div></section>
<section class="todo69-stats"><div class="todo69-stat"><span>Offen</span><strong id="statOpen">0</strong></div><div class="todo69-stat"><span>Heute</span><strong id="statToday">0</strong></div><div class="todo69-stat"><span>Überfällig</span><strong id="statOverdue">0</strong></div><div class="todo69-stat"><span>Erledigt</span><strong id="statDone">0</strong></div></section>
<section class="todo69-toolbar"><input id="search" placeholder="Aufgaben, Schritte und Material durchsuchen …"><select id="classFilter"><option value="all">Alle Klassen</option></select><select id="subjectFilter"><option value="all">Alle Fächer</option></select><select id="priorityFilter"><option value="all">Alle Prioritäten</option><option value="high">Hoch</option><option value="normal">Normal</option><option value="low">Niedrig</option></select></section>
<div class="todo69-tabs" id="tabs"><button class="active" data-filter="open">Offen</button><button data-filter="today">Heute</button><button data-filter="upcoming">Demnächst</button><button data-filter="overdue">Überfällig</button><button data-filter="done">Erledigt</button><button data-filter="all">Alle</button></div>
<section class="todo69-layout"><div class="todo69-list-pane"><div class="todo69-list-head"><h2>Aufgaben</h2><span id="listCount">0 Aufgaben</span></div><div class="todo69-list" id="todoList69"></div></div><aside class="todo69-detail empty" id="todoDetail69"></aside></section>
<div class="todo69-sync-state" id="syncState"></div>
</main>
<script src="../classroom-tools-shared.js?v=20260923-v69"></script>
<script src="../todo-store.js?v=20260923-v69"></script>
<script src="../teacher-shell.js?v=20260923-v69"></script>
<script src="todos-v69.js?v=20260923-v69"></script>
</body>
