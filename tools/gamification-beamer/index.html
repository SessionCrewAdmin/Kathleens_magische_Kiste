<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quest Classroom</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:4vw;background:radial-gradient(circle at 15% 10%,#ffe2ef,transparent 35%),radial-gradient(circle at 90% 10%,#eee8ff,transparent 35%),#fff9fc;color:#503d51;font-family:Inter,Arial}.k{font-weight:1000;letter-spacing:.15em;font-size:1vw;color:#9b7b96}h1{font-size:4vw;margin:.4vw 0 2vw}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:1.5vw}.box{background:#ffffffd9;border:1px solid #eadde9;border-radius:2vw;padding:2vw;box-shadow:0 2vw 6vw #74507018}.xp{font-size:4vw;font-weight:1000}.bar{height:2vw;background:#f0e7ef;border-radius:99px;overflow:hidden;margin:1.4vw 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#efa5c7,#b9a6e8)}.combo{text-align:center;font-size:3vw}.boss{font-size:2vw}.small{font-size:1.5vw;color:#8d788f}.teams{display:grid;grid-template-columns:repeat(2,1fr);gap:1vw;margin-top:1.5vw}.team{background:#fff;border:1px solid #eadde9;border-radius:1vw;padding:1vw;font-size:1.4vw}@media(max-width:800px){.grid{grid-template-columns:1fr}.k{font-size:12px}h1{font-size:34px}.xp{font-size:32px}.small{font-size:14px}}</style></head><body><div class="k">QUEST MODE · CLASSROOM DISPLAY</div><h1 id="title">Klassenquest</h1><main id="app">Warte auf Quest-Daten …</main><script src="../classroom-tools-shared.js"></script><script src="../gamification-preview.js"></script><script>function draw(){const g=window.KathleenGamification;if(!g)return;const s=g.load(),c=s.classes[s.activeClassId];if(!c)return;title.textContent=c.name+' · Level '+c.level;const wp=Math.min(100,c.weekly.progress/c.weekly.target*100),bp=Math.min(100,c.boss.progress/c.boss.target*100);app.innerHTML='<div class="grid"><section class="box"><div class="small">KLASSENFORTSCHRITT</div><div class="xp">'+c.classXp+' XP</div><div class="bar"><i style="width:'+((c.classXp%250)/250*100)+'%"></i></div><div class="small">'+c.weekly.title+'</div><div class="bar"><i style="width:'+wp+'%"></i></div><div class="small">'+c.weekly.progress+' / '+c.weekly.target+' XP</div></section><section class="box combo">🔥<br><b>'+c.combo+'×</b><br><span class="small">COMBO</span></section></div><section class="box" style="margin-top:1.5vw"><div class="boss">'+(c.boss.active?'👾 '+c.boss.title:'✨ Gemeinsam als Klasse')+'</div>'+(c.boss.active?'<div class="bar"><i style="width:'+bp+'%"></i></div><div class="small">'+c.boss.progress+' / '+c.boss.target+' Treffer</div>':'<div class="small">Hier erscheinen nur gemeinsame Fortschritte – keine Schülerdaten.</div>')+(c.teams?.length?'<div class="teams">'+c.teams.map(t=>'<div class="team"><b>'+t.name+'</b><br>'+t.members.length+' Mitglieder</div>').join('')+'</div>':'')+'</section>'}draw();addEventListener('storage',draw);addEventListener('kathleen:gamification',draw);setInterval(draw,1500);</script></body></html>
