<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quest · Beamer</title><link rel="stylesheet" href="../quest-mode/quest.css?v=20260922-1"><style>body{padding:3vw}.display{max-width:1600px;margin:auto}.display h1{font-size:clamp(28px,4vw,60px);margin:8px 0 24px}.display .hero{min-height:330px}.display .section-grid{margin-top:24px;grid-template-columns:1fr 1fr}.display .card h2{font-size:clamp(18px,2vw,30px)}.display .weekly-title{font-size:clamp(20px,3vw,40px)}.display .statline{font-size:clamp(16px,2vw,28px)}.display .combo-number{font-size:clamp(40px,6vw,80px)}.display .hero-copy h2{font-size:clamp(24px,3vw,44px)}.display .meter-caption b{font-size:clamp(23px,3vw,40px)}.display .hero-progress{max-width:none}.display .combo-card{display:block;text-align:center;grid-column:auto}.display .bar{height:18px}.display .combo-card p{max-width:none}.display .boss-detail p{font-size:18px}@media(max-width:650px){.display .section-grid{grid-template-columns:1fr}.display .hero{min-height:290px}.display .hero-progress{width:100%}}</style></head><body><main class="display" id="display"><p>Warte auf die Klassenquest …</p></main><script src="../gamification-preview.js?v=20260922-weekly-reset1"></script><script>
(()=>{'use strict';const params=new URLSearchParams(location.search),pinned=params.get('class'),root=document.getElementById('display'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=x=>Number(x||0).toLocaleString('de-DE'),bar=(n,d)=>'<div class="bar"><span style="width:'+Math.max(0,Math.min(100,d>0?n/d*100:0))+'%"></span></div>';
function draw(){const s=KathleenGamification.load(),c=s.classes[pinned||s.activeClassId];if(!c){root.innerHTML='<section class="empty"><h1>Noch keine Klassenquest</h1><p>Öffne den Quest Mode in der Lehreransicht und wähle eine Klasse aus.</p></section>';return}const b=c.boss,w=c.weekly,level=Math.floor(c.classXp/250)+1;root.innerHTML='<span class="eyebrow">GEMEINSAM LERNEN. GEMEINSAM LEVELN.</span><h1>Klasse '+esc(c.name)+' · Quest Mode</h1><section class="hero"><div class="hero-copy"><h2>Auf zum nächsten Level!</h2></div><div class="hero-progress"><div class="level-shield"><small>LEVEL</small><b>'+num(level)+'</b></div><div class="hero-meter">'+bar(c.classXp%250,250)+'<div class="meter-caption"><b>'+num(c.classXp)+' / '+num(level*250)+' XP</b></div></div></div></section><div class="section-grid"><section class="card weekly-card"><div class="card-top"><h2>🎯 Wochenziel</h2></div><p class="weekly-title">'+esc(w.title)+'</p>'+bar(w.progress,w.target)+'<div class="statline"><span>'+num(w.progress)+' / '+num(w.target)+' XP</span><span>'+(w.done?'✓ Geschafft':'Gemeinsam ans Ziel')+'</span></div></section><section class="card combo-card"><h2>🔥 Eure Combo</h2><div class="combo-number">'+num(c.combo)+'×</div><p>Erfolgreiche Aktionen in Folge</p></section><section class="card" style="grid-column:1/-1"><div class="card-top"><h2>👾 '+esc(b.title)+'</h2></div><p class="weekly-title">'+(b.done?'🏆 Gemeinsam geschafft!':b.active?'Die Challenge läuft!':'Bereit für eure nächste Challenge')+'</p>'+bar(b.progress,b.target)+'<div class="statline"><span>'+num(b.progress)+' / '+num(b.target)+' Treffer</span><span>+'+num(b.reward)+' Klassen-XP</span></div></section></div>'}draw();addEventListener('storage',draw);addEventListener('kathleen:gamification',draw);})();
</script></body></html>
