<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf6fb"><title>Quick Games · Kathleens Kiste</title>
<link rel="stylesheet" href="../teacher-design-v50.css?v=20260923-v64"><link rel="stylesheet" href="../teacher-page-adapters-v50.css?v=20260923-v64"><link rel="stylesheet" href="../teacher-premium-pages-v57.css?v=20260923-v64"><link rel="stylesheet" href="buzzer-arena-v3.css?v=20260924-v4"><link rel="stylesheet" href="risk-premium-v2.css?v=20260924-v2">
<style>:root{--qg-ink:#55455e;--qg-muted:#85788e;--qg-line:#e8dfe9;--qg-shadow:0 12px 34px rgba(91,67,98,.09)}*{box-sizing:border-box}body{margin:0;background:#f8f3f8;color:var(--qg-ink);font-family:Inter,"Segoe UI",system-ui,sans-serif}.qg-shell{max-width:1480px;margin:auto;padding:24px 28px 38px}.qg-hero{display:flex;justify-content:space-between;gap:20px;padding:22px 24px;border:1px solid var(--qg-line);border-radius:18px;background:#fffdfd;box-shadow:var(--qg-shadow)}.qg-kicker{font-size:9px;letter-spacing:.15em;font-weight:900;color:#9a7f96}.qg-hero h1{margin:4px 0 7px;font:700 34px Georgia,serif}.qg-hero p{margin:0;color:var(--qg-muted);font-size:12px}.qg-context,.qg-actions,.qg-controls,.qg-hud{display:flex;gap:7px;flex-wrap:wrap}.qg-pill,.qg-hud span{padding:8px 11px;border:1px solid var(--qg-line);border-radius:999px;background:#fff;font-size:9px;font-weight:800}.qg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.qg-game{position:relative;z-index:2;min-height:164px;border:1px solid var(--qg-line);border-radius:17px;padding:18px;background:#fff;cursor:pointer;text-align:left;color:var(--qg-ink);pointer-events:auto}.qg-game.active{outline:2px solid #ad91c2;outline-offset:2px}.qg-icon{font-size:25px}.qg-game h3{margin:10px 0 5px}.qg-game p{font-size:10px;color:var(--qg-muted)}.qg-badge{display:inline-block;margin:7px 4px 0 0;padding:5px 7px;border-radius:999px;background:#f7f2f8;font-size:8px;font-weight:900}.qg-workspace{display:none;grid-template-columns:350px minmax(0,1fr);gap:14px;margin-top:14px}.qg-workspace.show{display:grid}.qg-card{border:1px solid var(--qg-line);border-radius:17px;background:#fffdfd}.qg-editor,.qg-play{padding:16px}.qg-field{display:block;margin-top:10px}.qg-field span{display:block;margin-bottom:5px;font-size:8px;font-weight:900}.qg-field input,.qg-field textarea{width:100%;padding:9px;border:1px solid var(--qg-line);border-radius:10px}.qg-field textarea{min-height:210px}.qg-help{margin-top:8px;padding:9px;background:#f7f2f8;font-size:9px}.qg-btn{border:1px solid var(--qg-line);border-radius:10px;background:#fff;padding:9px 11px;font-size:10px;font-weight:850;cursor:pointer}.qg-btn.primary{background:#9f87bc;color:#fff}.qg-btn.good{background:#eef8f3}.qg-btn.bad{background:#fff1f4}.qg-play-head{display:flex;justify-content:space-between}.qg-stage-wrap{position:relative;margin-top:12px;min-height:420px;border:1px solid #dfd4e3;border-radius:18px;overflow:hidden}.qg-stage{min-height:420px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.qg-stage h2{font:700 clamp(30px,5vw,58px) Georgia,serif}.qg-stage .answer{padding:12px 16px;border:1px solid var(--qg-line);border-radius:12px;background:#fff;font-weight:800}.qg-scoreboard,.qg-risk-choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(760px,100%);margin-top:20px}.qg-score,.qg-risk-card{padding:18px;border:1px solid var(--qg-line);border-radius:16px;background:#fff}.qg-score strong{display:block;font:700 46px Georgia,serif}.qg-hidden{display:none!important}.qg-controls{margin-top:11px}.qg-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);padding:10px 14px;border-radius:999px;background:#5d4965;color:#fff;opacity:0}body.present{overflow:hidden;background:#0b0810}body.present .qg-shell>*:not(.qg-workspace){display:none!important}body.present .qg-workspace{display:block;margin:0}body.present .qg-editor,body.present .qg-play-head,body.present .qg-controls{display:none!important}body.present .qg-shell{max-width:none;padding:0}body.present .qg-play{padding:0;border:0}body.present .qg-stage-wrap{margin:0;border:0;border-radius:0;min-height:100vh}body.present .qg-stage{padding:0;min-height:100vh}@media(max-width:980px){.qg-grid{grid-template-columns:repeat(2,1fr)}.qg-workspace{grid-template-columns:1fr}}@media(max-width:560px){.qg-grid{grid-template-columns:1fr}.qg-shell{padding:12px}}</style></head><body>
<main class="qg-shell"><section class="qg-hero"><div><div class="qg-kicker">QUICK GAMES</div><h1>Kleine Spiele. Sofort einsatzbereit.</h1><p>Kurze Unterrichtsspiele mit austauschbaren Inhalten und Beamer-Modus.</p></div><div class="qg-context"><span class="qg-pill">Quick Games</span></div></section><section class="qg-grid" id="gameGrid"></section><section class="qg-workspace" id="workspace"><aside class="qg-card qg-editor" id="editorPanel"><h2 id="editorTitle"></h2><p id="editorDesc"></p><label class="qg-field"><span>Set-Titel</span><input id="setTitle"></label><label class="qg-field"><span>Inhalte</span><textarea id="contentBox"></textarea></label><div class="qg-help" id="formatHelp"></div><div class="qg-actions"><button class="qg-btn primary" id="saveBtn">Speichern</button><button class="qg-btn" id="demoBtn">Beispiel</button></div></aside><section class="qg-card qg-play"><div class="qg-play-head"><div><div class="qg-kicker" id="playKicker">SPIELBEREIT</div><h2 id="playTitle"></h2></div><div class="qg-hud"><span id="roundHud">Runde 0</span></div></div><div class="qg-stage-wrap"><div class="qg-stage" id="stage"></div></div><div class="qg-controls" id="controls"></div></section></section></main><div class="qg-toast" id="toast"></div>
<script>(()=>{'use strict';const STORE='kathleenQuickGamesV1';const present=new URLSearchParams(location.search).get('present')==='1';if(present)document.body.classList.add('present');const META={buzzer:{icon:'◉',title:'Buzzer Battle',desc:'Zwei Teams. Ein Buzzer. Wer ist schneller?',badges:['PREMIUM V3','Teams'],format:'Frage | Antwort',demo:'Hauptstadt von Frankreich? | Paris\nWie viele Kontinente gibt es? | 7\nNenne das Gegenteil von ancient. | modern'},risk:{icon:'⚡',title:'Risk or Safe',desc:'Sichere Punkte oder volles Risiko.',badges:['PREMIUM V2'],format:'Frage | Antwort',demo:'5 + 7? | 12\nFall der Berliner Mauer? | 1989'},timeline:{icon:'↕',title:'Timeline Race',desc:'Ereignisse richtig sortieren.',badges:['Demo'],format:'Jahr | Ereignis',demo:'1945 | Kriegsende\n1949 | BRD und DDR\n1989 | Mauerfall'},picture:{icon:'▦',title:'Picture Reveal',desc:'Bild Stück für Stück aufdecken.',badges:['Demo'],format:'Bild-URL | Lösung',demo:''},bomb:{icon:'●',title:'Word Bomb',desc:'Begriffe nennen, bevor die Zeit abläuft.',badges:['Demo'],format:'Kategorie',demo:'English-speaking countries\nIrregular verbs'},classvs:{icon:'♛',title:'Class vs Teacher',desc:'Klasse gegen Frau Müller.',badges:['Demo'],format:'Frage | Antwort',demo:'7 × 8? | 56'}};let db=null;try{db=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}if(!db||!db.sets){db={sets:{}}}for(const [k,m] of Object.entries(META)){if(!db.sets[k])db.sets[k]={title:m.title,content:m.demo}}let game='buzzer',state={};const byId=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function rows(){return String(db.sets[game]?.content||'').split(/\n+/).filter(Boolean).map(x=>x.split('|').map(y=>y.trim()))}function fresh(){state={round:1,reveal:false,scoreA:0,scoreB:0,question:'',answer:''}}function buildGrid(){byId('gameGrid').innerHTML=Object.entries(META).map(([k,m])=>`<button type="button" class="qg-game" data-game="${k}"><div class="qg-icon">${m.icon}</div><h3>${m.title}</h3><p>${m.desc}</p>${m.badges.map(b=>`<span class="qg-badge">${b}</span>`).join('')}</button>`).join('')}function select(g){if(!META[g])return;game=g;fresh();document.body.dataset.qgpGame=g;document.querySelectorAll('.qg-game').forEach(x=>x.classList.toggle('active',x.dataset.game===g));byId('workspace').classList.add('show');const m=META[g],set=db.sets[g];byId('editorTitle').textContent=m.title+' bearbeiten';byId('editorDesc').textContent=m.desc;byId('playTitle').textContent=set.title||m.title;byId('setTitle').value=set.title||m.title;byId('contentBox').value=set.content||'';byId('formatHelp').textContent=m.format;next(true)}function next(initial=false){if(!initial)state.round++;state.reveal=false;const p=rows();const x=p.length?p[(state.round-1)%p.length]:['Noch keine Frage',''];state.question=x[0]||'Noch keine Frage';state.answer=x.slice(1).join(' | ');render()}function render(){document.body.dataset.qgpGame=game;byId('roundHud').textContent='Runde '+state.round;if(game==='buzzer')byId('stage').innerHTML=`<div class="label">BUZZER BATTLE</div><h2>${esc(state.question)}</h2>${state.reveal?`<div class="answer">${esc(state.answer)}</div>`:''}<div class="qg-scoreboard"><div class="qg-score"><b>Team A</b><strong>${state.scoreA}</strong></div><div class="qg-score"><b>Team B</b><strong>${state.scoreB}</strong></div></div>`;else if(game==='risk')byId('stage').innerHTML=`<h2>${esc(state.question)}</h2>${state.reveal?`<div class="answer">${esc(state.answer)}</div>`:''}<div class="qg-risk-choice"><div class="qg-risk-card safe"><strong>SAFE</strong><p>+1 Punkt</p></div><div class="qg-risk-card risk"><strong>RISK</strong><p>+2 / −1</p></div></div>`;else byId('stage').innerHTML=`<h2>${esc(state.question||META[game].title)}</h2>${state.reveal?`<div class="answer">${esc(state.answer)}</div>`:''}`;controls();window.dispatchEvent(new CustomEvent('kathleen:qg-render',{detail:{game}}))}function controls(){if(present){byId('controls').innerHTML='';return}const c=byId('controls');c.innerHTML='';const add=(t,f,cl='')=>{const b=document.createElement('button');b.type='button';b.className='qg-btn '+cl;b.textContent=t;b.addEventListener('click',f);c.appendChild(b)};add('⛶ Beamer',()=>{const u=new URL(location.href);u.searchParams.set('present','1');u.searchParams.set('game',game);window.open(u,'qg-present','width=1280,height=800')});add('Antwort zeigen',()=>{state.reveal=true;render()});if(game==='buzzer'){add('Team A ✓',()=>{state.scoreA++;next()},'good');add('Team B ✓',()=>{state.scoreB++;next()},'good');add('Falsch',()=>next(),'bad')}add('Nächste Runde',()=>next())}function save(){db.sets[game]={title:byId('setTitle').value||META[game].title,content:byId('contentBox').value};localStorage.setItem(STORE,JSON.stringify(db));select(game)}function boot(){buildGrid();byId('gameGrid').addEventListener('click',e=>{const card=e.target.closest('.qg-game[data-game]');if(card)select(card.dataset.game)});byId('saveBtn').addEventListener('click',save);byId('demoBtn').addEventListener('click',()=>{byId('contentBox').value=META[game].demo});select(present?(new URLSearchParams(location.search).get('game')||'buzzer'):'buzzer')}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot()})();</script>
<script src="buzzer-arena-v3.js?v=20260924-v4"></script><script src="risk-premium-v2.js?v=20260924-v2"></script></body></html>
