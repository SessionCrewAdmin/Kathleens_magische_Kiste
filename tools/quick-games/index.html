<style>:root{--qg-ink:#55455e;--qg-muted:#85788e;--qg-line:#e8dfe9;--qg-paper:#fffdfd}*{box-sizing:border-box}body{margin:0;background:#f8f3f8;color:var(--qg-ink);font-family:Inter,"Segoe UI",system-ui,sans-serif}.qg-shell{max-width:1480px;margin:auto;padding:24px}.qg-hero{display:flex;justify-content:space-between;padding:22px;border:1px solid var(--qg-line);border-radius:18px;background:#fff}.qg-kicker{font-size:9px;letter-spacing:.15em;font-weight:900}.qg-hero h1{margin:4px 0;font:700 34px Georgia,serif}.qg-hero p{color:var(--qg-muted);font-size:12px}.qg-context,.qg-hud,.qg-actions,.qg-controls{display:flex;gap:7px;flex-wrap:wrap}.qg-pill,.qg-hud span{padding:8px 10px;border:1px solid var(--qg-line);border-radius:999px;background:#fff;font-size:9px}.qg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.qg-game{min-height:164px;border:1px solid var(--qg-line);border-radius:17px;padding:18px;background:#fff;cursor:pointer;text-align:left;color:var(--qg-ink)}.qg-game.active{outline:2px solid #ad91c2}.qg-icon{font-size:25px}.qg-game h3{margin:10px 0 5px}.qg-game p{font-size:10px;color:var(--qg-muted)}.qg-badge{display:inline-block;margin:8px 4px 0 0;padding:5px 7px;border-radius:999px;background:#f7f2f8;font-size:8px;font-weight:900}.qg-workspace{display:none;grid-template-columns:350px minmax(0,1fr);gap:14px;margin-top:14px}.qg-workspace.show{display:grid}.qg-card{border:1px solid var(--qg-line);border-radius:17px;background:#fff}.qg-editor,.qg-play{padding:16px}.qg-field{display:block;margin-top:10px}.qg-field span{display:block;margin-bottom:5px;font-size:8px;font-weight:900}.qg-field input,.qg-field textarea{width:100%;padding:9px;border:1px solid var(--qg-line);border-radius:10px}.qg-field textarea{min-height:210px}.qg-help{margin-top:8px;padding:9px;background:#f7f2f8;font-size:9px}.qg-btn{border:1px solid var(--qg-line);border-radius:10px;background:#fff;padding:9px 11px;font-size:10px;font-weight:850;cursor:pointer}.qg-btn.primary{background:#9f87bc;color:#fff}.qg-btn.good{background:#eef8f3}.qg-btn.bad{background:#fff1f4}.qg-play-head{display:flex;justify-content:space-between}.qg-stage-wrap{position:relative;margin-top:12px;min-height:420px;border:1px solid #dfd4e3;border-radius:18px;overflow:hidden}.qg-stage{min-height:420px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.qg-stage h2{font:700 clamp(30px,5vw,58px) Georgia,serif}.qg-stage .answer{padding:12px 16px;border:1px solid var(--qg-line);border-radius:12px;background:#fff;font-weight:800}.qg-scoreboard,.qg-risk-choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(760px,100%);margin-top:20px}.qg-score,.qg-risk-card{padding:18px;border:1px solid var(--qg-line);border-radius:16px;background:#fff}.qg-score strong{display:block;font:700 46px Georgia,serif}.qg-timeline{display:grid;gap:8px;width:min(850px,100%)}.qg-timeitem{display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:10px;border:1px solid var(--qg-line);border-radius:11px;background:#fff}.qg-picture{position:relative;width:min(820px,92%);aspect-ratio:16/9;overflow:hidden}.qg-picture img{width:100%;height:100%;object-fit:cover}.qg-tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr)}.qg-tile{background:#cbb7d6;border:1px solid #eee}.qg-tile.off{opacity:0}.qg-bomb{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:#49394f;color:#fff;font-size:42px}.qg-hidden{display:none!important}body.present{overflow:hidden;background:#0b0810}body.present .qg-shell>*:not(.qg-workspace){display:none!important}body.present .qg-workspace{display:block!important;margin:0}body.present .qg-editor,body.present .qg-play-head,body.present .qg-controls{display:none!important}body.present .qg-shell{max-width:none;padding:0}body.present .qg-play{padding:0;border:0}body.present .qg-stage-wrap{margin:0;border:0;border-radius:0;min-height:100vh}body.present .qg-stage{min-height:100vh}@media(max-width:900px){.qg-grid{grid-template-columns:repeat(2,1fr)}.qg-workspace{grid-template-columns:1fr}}@media(max-width:560px){.qg-grid{grid-template-columns:1fr}}</style></head>
<body><script>if(new URLSearchParams(location.search).get('present')==='1')document.body.classList.add('present')</script>
<main class="qg-shell"><section class="qg-hero"><div><div class="qg-kicker">KATHLEEN'S ARCADE</div><h1>Was spielen wir heute?</h1><p>Wähle ein Spiel, bereite dein Set in der Lobby vor und starte direkt in die immersive Spielansicht.</p></div><div class="qg-context"><span class="qg-pill">GAME LIBRARY</span><span class="qg-pill">6 QUICK GAMES</span></div></section><section class="qg-grid" id="gameGrid"></section><section class="qg-workspace" id="workspace"><aside class="qg-card qg-editor" id="editorPanel"><h2 id="editorTitle"></h2><p id="editorDesc"></p><label class="qg-field"><span>Set-Titel</span><input id="setTitle"></label><label class="qg-field"><span>Inhalte</span><textarea id="contentBox"></textarea></label><div class="qg-help" id="formatHelp"></div><div class="qg-actions"><button class="qg-btn primary" id="saveBtn">Speichern</button><button class="qg-btn" id="demoBtn">Vorlage</button></div></aside><section class="qg-card qg-play"><div class="qg-play-head"><div><div class="qg-kicker">SPIELBEREIT</div><h2 id="playTitle"></h2></div><div class="qg-hud"><span id="roundHud">Runde 0</span></div></div><div class="qg-stage-wrap"><div class="qg-stage" id="stage"></div></div><div class="qg-controls" id="controls"></div></section></section></main>
<script>(()=>{'use strict';const STORE='kathleenQuickGamesV1',present=new URLSearchParams(location.search).get('present')==='1';const META={buzzer:{icon:'◉',title:'Buzzer Battle',desc:'Zwei Teams. Ein Buzzer. Wer ist schneller?',badges:['PREMIUM V3','TEAMS'],format:'Frage | Antwort',demo:'Hauptstadt von Frankreich? | Paris\nWie viele Kontinente gibt es? | 7\nNenne das Gegenteil von ancient. | modern'},risk:{icon:'⚡',title:'Risk or Safe',desc:'Sichere Punkte oder volles Risiko.',badges:['PREMIUM V2'],format:'safe | Frage | Antwort',demo:'safe | 5 + 7? | 12\nrisk | Fall der Berliner Mauer? | 1989'},timeline:{icon:'↕',title:'Timeline Race',desc:'Ereignisse richtig sortieren.',badges:['DEMO'],format:'Jahr | Ereignis',demo:'1945 | Kriegsende\n1949 | BRD und DDR\n1989 | Mauerfall'},picture:{icon:'▦',title:'Picture Reveal',desc:'Bild Stück für Stück aufdecken.',badges:['DEMO'],format:'Bild-URL | Lösung',demo:''},bomb:{icon:'●',title:'Word Bomb',desc:'Begriffe nennen, bevor die Zeit abläuft.',badges:['DEMO'],format:'Kategorie',demo:'English-speaking countries\nIrregular verbs'},classvs:{icon:'♛',title:'Class vs Teacher',desc:'Klasse gegen Frau Müller.',badges:['DEMO'],format:'Frage | Antwort',demo:'7 × 8? | 56'}};let db;try{db=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}if(!db?.sets)db={sets:{}};for(const[k,m]of Object.entries(META))if(!db.sets[k])db.sets[k]={title:m.title,content:m.demo};let game='buzzer',state={};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function rows(g=game){return String(db.sets[g]?.content||'').split(/\n+/).filter(Boolean).map(x=>x.split('|').map(v=>v.trim()))}function fresh(){state={round:1,reveal:false,scoreA:0,scoreB:0,question:'',answer:'',mode:''}}function grid(){$('gameGrid').innerHTML=Object.entries(META).map(([k,m])=>`<button type="button" class="qg-game" data-game="${k}"><div class="qg-icon">${m.icon}</div><h3>${m.title}</h3><p>${m.desc}</p>${m.badges.map(b=>`<span class="qg-badge">${b}</span>`).join('')}</button>`).join('')}function select(g){if(!META[g])return;game=g;fresh();document.body.dataset.qgpGame=g;document.querySelectorAll('.qg-game').forEach(x=>x.classList.toggle('active',x.dataset.game===g));$('workspace').classList.add('show');const m=META[g],set=db.sets[g];$('editorTitle').textContent=m.title+' bearbeiten';$('editorDesc').textContent=m.desc;$('playTitle').textContent=set.title||m.title;$('setTitle').value=set.title||m.title;$('contentBox').value=set.content||'';$('formatHelp').textContent=m.format;next(true)}function next(first=false){if(!first)state.round++;state.reveal=false;const p=rows();if(game==='risk'&&!state.mode){state.question='Wie mutig seid ihr?';state.answer=''}else{const x=p[(state.round-1)%Math.max(1,p.length)]||['Noch keine Frage',''];state.question=x[game==='risk'?1:0]||x[0];state.answer=x.slice(game==='risk'?2:1).join(' | ')}render()}function render(){document.body.dataset.qgpGame=game;$('roundHud').textContent='Runde '+state.round;if(game==='buzzer')$('stage').innerHTML=`<div class="label">BUZZER BATTLE</div><h2>${esc(state.question)}</h2>${state.reveal?`<div class="answer">${esc(state.answer)}</div>`:''}<div class="qg-scoreboard"><div class="qg-score"><b>Team A</b><strong>${state.scoreA}</strong></div><div class="qg-score"><b>Team B</b><strong>${state.scoreB}</strong></div></div>`;else if(game==='risk'&&!state.mode)$('stage').innerHTML='<h2>Wie mutig seid ihr?</h2><div class="qg-risk-choice"><div class="qg-risk-card safe"><strong>SAFE</strong><p>+1 Punkt</p></div><div class="qg-risk-card risk"><strong>RISK</strong><p>+2 / −1</p></div></div>';else $('stage').innerHTML=`<h2>${esc(state.question||META[game].title)}</h2>${state.reveal?`<div class="answer">${esc(state.answer)}</div>`:''}`;controls();window.dispatchEvent(new CustomEvent('kathleen:qg-render',{detail:{game}}))}function controls(){const c=$('controls');c.innerHTML='';if(present)return;const add=(t,f,cl='')=>{const b=document.createElement('button');b.className='qg-btn '+cl;b.textContent=t;b.onclick=f;c.appendChild(b)};add('Antwort',()=>{state.reveal=true;render()});if(game==='buzzer'){add('Team A ✓',()=>{state.scoreA++;next()},'good');add('Team B ✓',()=>{state.scoreB++;next()},'good');add('Falsch',()=>next(),'bad')}add('Nächste Runde',()=>next())}function save(){db.sets[game]={title:$('setTitle').value||META[game].title,content:$('contentBox').value};localStorage.setItem(STORE,JSON.stringify(db));$('playTitle').textContent=db.sets[game].title;next(true)}function boot(){grid();$('gameGrid').addEventListener('click',e=>{const card=e.target.closest('[data-game]');if(card)select(card.dataset.game)});$('saveBtn').onclick=save;$('demoBtn').onclick=()=>{$('contentBox').value=META[game].demo};if(present)select(new URLSearchParams(location.search).get('game')||'buzzer');else select('buzzer')}document.readyState==='loading'?document.addEventListener('DOMContentLoaded',boot,{once:true}):boot()})();</script>
