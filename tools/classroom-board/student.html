<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Schüler · Classroom Board · V19</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-rounded,"SF Pro Rounded",Arial,sans-serif;color:#4f3d51;background:#f4eef5}.hidden{display:none!important}.btn{border:1px solid #ddcfdf;background:#fff;color:#59465d;border-radius:12px;padding:10px 12px;font-weight:850;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.joinWrap{min-height:100%;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top,#fff 0,#f4eef5 55%)}.card{width:min(520px,100%);background:#fff;border:1px solid #e6dbe7;border-radius:24px;padding:24px;box-shadow:0 22px 60px #583f5d18}.card h1{margin:0 0 6px}.card p{margin:0 0 18px;color:#837386}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:11px;text-transform:uppercase;font-weight:950;color:#88798b}.field input{border:1px solid #ddcfdf;border-radius:13px;padding:13px;font-size:17px;font-weight:800;color:#4f3d51}.rosterBox{display:grid;gap:10px}.rosterSearch{width:100%;border:1px solid #ddcfdf;border-radius:12px;padding:11px}.rosterNames{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:340px;overflow:auto}.studentName{border:1px solid #e0d4e2;background:#fffafd;border-radius:12px;padding:11px;text-align:left;font-weight:850;color:#57445b}.studentName small{display:block;color:#9a879d;margin-top:2px}.studentName:disabled{opacity:.45}.manualToggle{border:0;background:transparent;color:#7a6180;text-decoration:underline;cursor:pointer}.manualName{margin-top:10px}.rosterState{text-align:center;padding:20px;color:#8a7b8d}.room{height:100%;display:grid;grid-template-rows:58px 1fr 72px}.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid #e5d9e6;z-index:10}.connection{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:850}.dot{width:8px;height:8px;border-radius:50%;background:#cf6874}.dot.online{background:#58b88a}.top b{font-size:12px}.phase,.writeBadge,.followBadge{font-size:9px;font-weight:900;padding:6px 8px;border-radius:999px;background:#f1eaf5;white-space:nowrap}.writeBadge.on{background:#dff5e9;color:#347356}.followBadge.on{background:#eee8ff;color:#6c58a0}.traffic{margin-left:auto;width:24px;height:24px;border-radius:50%;background:#59b887}.boardViewport{position:relative;overflow:hidden;background:#eee8ef;touch-action:none}.world{position:absolute;width:6000px;height:4000px;transform-origin:0 0;background:#fff;background-image:radial-gradient(#d9cbd8 1.2px,transparent 1.2px);background-size:24px 24px}.world.lined{background-image:repeating-linear-gradient(#fff 0,#fff 31px,#eadde9 32px)}.world.grid{background-image:linear-gradient(#eadde9 1px,transparent 1px),linear-gradient(90deg,#eadde9 1px,transparent 1px);background-size:32px 32px}.world.boardgreen{background:#315b4b}.item{position:absolute;border-radius:16px;overflow:hidden}.sticky{background:#fff0a9}.textitem{background:#fff}.widget{background:#fff;border:1px solid #eadde9}.body{padding:10px}.ink{position:absolute;left:0;top:0;width:6000px;height:4000px}.studentTextLayer{position:absolute;left:0;top:0;width:6000px;height:4000px;pointer-events:none;z-index:6}.studentText{position:absolute;max-width:700px;padding:5px 8px;background:rgba(255,255,255,.9);border:1px solid #ddcfdf;border-radius:8px;font-weight:750;white-space:pre-wrap}.workspaceBar{display:flex;gap:6px;align-items:center;padding:8px;background:#fff;border-top:1px solid #eadde9;overflow-x:auto;min-width:0}.workspaceGroup{display:flex;gap:4px;align-items:center}.workspaceBar button{white-space:nowrap}.toolBtn.active,.state.active{background:#efe4f4;border-color:#b99acb;color:#674d70}.toolBtn{min-width:46px}.state{min-width:78px}.workspaceSep{width:1px;height:34px;background:#e7dce8;flex:0 0 auto}.colorWrap{width:38px;height:38px;border:1px solid #ddcfdf;border-radius:11px;overflow:hidden;background:#fff}.colorWrap input{width:50px;height:50px;border:0;padding:0;margin:-6px}.msg{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:30;background:#fff0f7;border:1px solid #e996bd;padding:14px 18px;border-radius:16px;font-weight:900;box-shadow:0 12px 30px #0002;max-width:calc(100vw - 28px)}.lock{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#654d68,#9276a6);color:#fff;display:grid;place-items:center;text-align:center;padding:20px}.lock .icon{font-size:78px}.reconnect{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:40;background:#5e4962;color:#fff;border-radius:999px;padding:8px 12px;font-size:10px;font-weight:900}.workspaceHint{position:fixed;right:12px;bottom:84px;z-index:12;background:#fff;border:1px solid #e1d4e3;border-radius:12px;padding:7px 10px;font-size:9px;font-weight:800;color:#78667b;box-shadow:0 8px 20px #0001}@media(max-width:700px){.rosterNames{grid-template-columns:1fr}.room{grid-template-rows:55px 1fr 76px}.top{padding:6px}.top #who{max-width:95px;overflow:hidden;text-overflow:ellipsis}.phase{display:none}.workspaceBar{padding:6px}.state{min-width:70px;font-size:9px}.btn{padding:9px 10px}.followBadge{display:none}}
</style>
</head>
<body>
<section class="joinWrap" id="join"><div class="card"><h1>✨ Klassenraum</h1><p>Raumcode prüfen und deinen Namen auswählen.</p><div class="field"><label>Raumcode</label><input id="code" maxlength="6" autocomplete="off" placeholder="ABC123"></div><div class="rosterBox" id="rosterBox"><div class="rosterState">Raumcode eingeben …</div></div><div class="manualName hidden" id="manualNameBox"><div class="field"><label>Name manuell eingeben</label><input id="manualName" autocomplete="name" placeholder="Vor- und Nachname"></div><button class="btn" id="manualJoinBtn">Beitreten</button></div></div></section>
<section class="room hidden" id="room">
<header class="top"><div class="connection"><i class="dot" id="onlineDot"></i><span id="connectionText">verbinden …</span></div><b id="who">Verbunden</b><span class="phase" id="phase">Freie Phase</span><span class="writeBadge" id="writeBadge">Nur ansehen</span><span class="followBadge" id="followBadge">Freie Ansicht</span><i class="traffic" id="traffic"></i></header>
<main class="boardViewport" id="viewport"><div class="world" id="world"><canvas class="ink" id="teacherInk" width="6000" height="4000"></canvas><canvas class="ink" id="studentInk" width="6000" height="4000"></canvas><div class="studentTextLayer" id="studentTextLayer"></div></div></main>
<footer class="workspaceBar">
  <div class="workspaceGroup"><button class="btn state" data-state="done">✓ Fertig</button><button class="btn state" data-state="help">? Hilfe</button><button class="btn state" data-state="unsure">● Unsicher</button></div>
  <span class="workspaceSep"></span>
  <div class="workspaceGroup"><button class="btn toolBtn active" data-tool="pen">✎ Stift</button><button class="btn toolBtn" data-tool="marker">▰ Marker</button><button class="btn toolBtn" data-tool="text">T Text</button><button class="btn toolBtn" data-tool="pan">✋ Hand</button></div>
  <label class="colorWrap"><input id="penColor" type="color" value="#6d4d73"></label>
  <span class="workspaceSep"></span>
  <button class="btn" id="undoWorkspace">↶ Rückgängig</button><button class="btn" id="clearWorkspace">🗑 Leeren</button>
  <div class="workspaceGroup"><button class="btn" id="zoomMinus">−</button><button class="btn" id="zoomPlus">＋</button></div>
  <button class="btn" id="fullscreenBtn">⛶</button>
</footer>
</section>
<div class="workspaceHint hidden" id="workspaceHint">Schreiben wurde von der Lehrkraft freigegeben.</div>
<div class="msg hidden" id="teacherMsg"></div><div class="reconnect hidden" id="reconnect">Verbindung wird wiederhergestellt …</div><div class="lock hidden" id="lock"><div><div class="icon">👀</div><h1>Bitte nach vorne schauen</h1><p>Kathleen gibt gleich wieder frei.</p></div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const SB='https://fzqxnjhuvgpgovcovosl.supabase.co/rest/v1/rpc/',KEY='sb_publishable_GIyyWoyaQXipaA4S9OuTyQ_cZn7LUgV';
const world=$('#world'),vp=$('#viewport'),tc=$('#teacherInk'),sc=$('#studentInk'),textLayer=$('#studentTextLayer'),tctx=tc.getContext('2d'),sctx=sc.getContext('2d');
async function rpc(n,b){const r=await fetch(SB+n,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(b||{})});const raw=await r.text(),x=raw?(()=>{try{return JSON.parse(raw)}catch(e){return raw}})():null;if(!r.ok){const err=new Error((x&&typeof x==='object'&&(x.message||x.details||x.hint))||raw||('HTTP '+r.status));err.status=r.status;throw err}return x}
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const q=new URLSearchParams(location.search);$('#code').value=(q.get('room')||localStorage.getItem('kathleenLastRoom')||'').toUpperCase();
let device=localStorage.getItem('kathleenStudentDevice')||crypto.randomUUID(),token=sessionStorage.getItem('kathleenStudentToken')||'',canWrite=false,follow=false,locked=false,scale=.55,tx=-450,ty=-300,pollTimer=null,lastBoard='',lastMsg=0,roster=[],tool='pen',drawing=false,current=null,pan=null,workspaceEvents=[],workspaceLoaded=false;
localStorage.setItem('kathleenStudentDevice',device);
function transform(v){if(v&&follow){scale=Number(v.scale)||scale;tx=Number(v.tx)||tx;ty=Number(v.ty)||ty}world.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')'}
function drawStrokes(ctx,strokes){ctx.clearRect(0,0,6000,4000);ctx.lineCap='round';ctx.lineJoin='round';for(const st of strokes){ctx.beginPath();ctx.strokeStyle=st.color||'#6d4d73';ctx.lineWidth=st.width||4;ctx.globalAlpha=st.alpha??1;(st.points||[]).forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}ctx.globalAlpha=1}
function activeWorkspace(){const active=[];for(const e of workspaceEvents){const p=e.payload||e;if(p.type==='clear')active.length=0;else if(p.type==='undo')active.pop();else if(p.type==='stroke'||p.type==='text')active.push(p)}return active}
function renderWorkspace(){const active=activeWorkspace(),strokes=active.filter(p=>p.type==='stroke').map(p=>p.stroke);drawStrokes(sctx,strokes);textLayer.innerHTML='';for(const p of active.filter(p=>p.type==='text')){const el=document.createElement('div');el.className='studentText';el.style.left=(+p.x||0)+'px';el.style.top=(+p.y||0)+'px';el.style.color=p.color||'#5b4164';el.style.fontSize=Math.min(72,Math.max(14,+p.size||28))+'px';el.textContent=p.text||'';textLayer.appendChild(el)}}
function renderBoard(b){if(!b)return;const key=JSON.stringify(b);if(key===lastBoard)return;lastBoard=key;world.className='world '+(b.bg||'');world.querySelectorAll('.item').forEach(e=>e.remove());for(const o of b.items||[]){const e=document.createElement('div');e.className='item '+(o.type==='sticky'?'sticky':o.type==='text'?'textitem':'widget');e.style.cssText='left:'+o.x+'px;top:'+o.y+'px;width:'+o.w+'px;height:'+o.h+'px;transform:rotate('+(o.rotation||0)+'deg);z-index:'+(o.z||0);e.innerHTML='<div class="body">'+o.html+'</div>';world.insertBefore(e,tc)}drawStrokes(tctx,b.strokes||[])}
function setConnection(ok,text){$('#onlineDot').classList.toggle('online',ok);$('#connectionText').textContent=text;$('#reconnect').classList.toggle('hidden',ok)}
function updateToolAvailability(){$$('[data-tool]').forEach(b=>b.disabled=!canWrite&&b.dataset.tool!=='pan');$('#undoWorkspace').disabled=!canWrite;$('#clearWorkspace').disabled=!canWrite;$('#penColor').disabled=!canWrite;if(!canWrite&&tool!=='pan')setTool('pan')}
function setTool(v){tool=v;$$('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===v));$('#workspaceHint').textContent=v==='pan'?'Ansicht verschieben':v==='text'?'Auf das Board tippen, um Text einzufügen.':v==='marker'?'Marker aktiv':'Stift aktiv';$('#workspaceHint').classList.toggle('hidden',!canWrite&&v==='pan')}
async function loadWorkspace(){if(!token)return;try{const r=await rpc('classroom_student_workspace',{p_student_token:token});if(r?.ok){workspaceEvents=(r.events||[]).map(e=>({id:e.id,payload:e.payload}));workspaceLoaded=true;renderWorkspace()}}catch(e){console.warn('Workspace konnte nicht geladen werden',e)}}
async function sendWorkspace(payload){if(!canWrite||locked)return false;const ok=await rpc('classroom_student_board_event',{p_student_token:token,p_payload:payload});if(!ok)throw Error('not_allowed');workspaceEvents.push({payload});renderWorkspace();return true}
async function poll(){if(!token)return;let s;try{s=await rpc('classroom_student_state',{p_student_token:token})}catch(e){setConnection(false,e.status?('Serverfehler '+e.status):'Verbindung fehlgeschlagen');return}if(!s?.ok){setConnection(false,'Session ungültig');return}setConnection(true,'live');try{const oldWrite=canWrite;canWrite=!!s.can_write;follow=!!s.follow_teacher;locked=!!s.locked;$('#writeBadge').textContent=canWrite?'✏️ Workspace':'Nur ansehen';$('#writeBadge').classList.toggle('on',canWrite);$('#followBadge').textContent=follow?'👀 Lehreransicht':'Freie Ansicht';$('#followBadge').classList.toggle('on',follow);$('#lock').classList.toggle('hidden',!locked);$('#phase').textContent=({explain:'Erklärung',solo:'Einzelarbeit',group:'Gruppenarbeit',class:'Klassenaufgabe',break:'Pause',free:'Freie Phase'})[s.phase]||s.phase;$('#traffic').style.background=({green:'#59b887',yellow:'#f2c75a',red:'#df6a75'})[s.traffic]||'#59b887';renderBoard(s.board_state);transform(s.viewport);updateToolAvailability();if(canWrite&&!oldWrite){setTool('pen');$('#workspaceHint').textContent='Schreiben wurde von der Lehrkraft freigegeben.';$('#workspaceHint').classList.remove('hidden');setTimeout(()=>$('#workspaceHint').classList.add('hidden'),2500)}const msgs=Array.isArray(s.messages)?s.messages:[];if(msgs.length&&msgs[msgs.length-1].id!==lastMsg){const m=msgs[msgs.length-1];lastMsg=m.id;$('#teacherMsg').textContent=m.body;$('#teacherMsg').classList.remove('hidden');setTimeout(()=>$('#teacherMsg').classList.add('hidden'),6000)}if(s.session_state==='closed'){$('#lock').classList.remove('hidden');$('#lock h1').textContent='Unterricht beendet';$('#lock p').textContent='Du kannst dieses Fenster schließen.'}}catch(e){console.error(e);setConnection(true,'live · Anzeigeproblem')}}
function beginPolling(){clearInterval(pollTimer);poll();pollTimer=setInterval(poll,1800)}
async function join(code,name){const j=await rpc('classroom_join',{p_room_code:code,p_display_name:name,p_device_token:device});if(!j.ok)throw Error(j.error||'join');token=j.student_token;sessionStorage.setItem('kathleenStudentToken',token);localStorage.setItem('kathleenLastRoom',code);localStorage.setItem('kathleenStudentName',name);$('#who').textContent=name;$('#join').classList.add('hidden');$('#room').classList.remove('hidden');transform();await loadWorkspace();beginPolling()}
function renderRoster(filter=''){const box=$('#rosterBox'),needle=filter.trim().toLocaleLowerCase('de'),rows=roster.filter(x=>!needle||x.name.toLocaleLowerCase('de').includes(needle));box.innerHTML='<input class="rosterSearch" id="rosterSearch" placeholder="Namen suchen …"><div class="rosterNames">'+rows.map(x=>'<button class="studentName" data-name="'+esc(x.name)+'" '+(x.available?'':'disabled')+'>'+esc(x.name)+(x.available?'':'<small>bereits verbunden</small>')+'</button>').join('')+'</div><button class="manualToggle" id="manualToggle">Mein Name fehlt</button>';$('#rosterSearch').value=filter;$('#rosterSearch').oninput=e=>renderRoster(e.target.value);$$('[data-name]').forEach(b=>b.onclick=async()=>{try{await join($('#code').value.trim().toUpperCase(),b.dataset.name)}catch(e){sessionStorage.removeItem('kathleenStudentToken');alert(e.message==='name_in_use'?'Dieser Name ist bereits verbunden.':'Verbindung fehlgeschlagen.')}});$('#manualToggle').onclick=()=>$('#manualNameBox').classList.toggle('hidden')}
async function loadRoster(){const code=$('#code').value.trim().toUpperCase();if(code.length!==6){$('#rosterBox').innerHTML='<div class="rosterState">Raumcode eingeben …</div>';return}$('#rosterBox').innerHTML='<div class="rosterState">Klassenliste wird geladen …</div>';try{const r=await rpc('classroom_roster',{p_room_code:code});if(!r?.ok){roster=[];$('#rosterBox').innerHTML='<div class="rosterState">Raumcode nicht gefunden.</div>';return}roster=Array.isArray(r.students)?r.students:[];renderRoster()}catch(e){$('#rosterBox').innerHTML='<div class="rosterState">Klassenliste konnte nicht geladen werden.</div>'}}
$('#code').oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);if(e.target.value.length===6)loadRoster()};$('#manualJoinBtn').onclick=async()=>{const code=$('#code').value.trim().toUpperCase(),name=$('#manualName').value.trim();if(code.length!==6||!name)return;try{await join(code,name)}catch(e){alert('Verbindung fehlgeschlagen.')}};if($('#code').value.length===6)loadRoster();
function point(e){const r=vp.getBoundingClientRect();return{x:(e.clientX-r.left-tx)/scale,y:(e.clientY-r.top-ty)/scale}}
$$('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
sc.onpointerdown=e=>{if(locked)return;const pt=point(e);if(tool==='pan'){pan={x:e.clientX,y:e.clientY,tx,ty};sc.setPointerCapture(e.pointerId);return}if(!canWrite)return;if(tool==='text'){const text=prompt('Text eingeben:');if(text?.trim())sendWorkspace({type:'text',x:pt.x,y:pt.y,text:text.trim().slice(0,1000),color:$('#penColor').value,size:28}).catch(()=>setConnection(false,'Übertragung fehlgeschlagen'));return}if(tool!=='pen'&&tool!=='marker')return;drawing=true;current={color:$('#penColor').value,width:tool==='marker'?18:(e.pointerType==='pen'?Math.max(2,6*(e.pressure||.5)):4),alpha:tool==='marker'?.28:1,points:[pt]};sc.setPointerCapture(e.pointerId)};
sc.onpointermove=e=>{if(pan){tx=pan.tx+e.clientX-pan.x;ty=pan.ty+e.clientY-pan.y;transform();return}if(!drawing||!current)return;current.points.push(point(e));const preview=activeWorkspace().filter(p=>p.type==='stroke').map(p=>p.stroke);drawStrokes(sctx,[...preview,current])};
sc.onpointerup=async e=>{if(pan){pan=null;return}if(!drawing)return;drawing=false;const stroke=current;current=null;try{await sendWorkspace({type:'stroke',stroke})}catch(err){renderWorkspace();setConnection(false,'Übertragung fehlgeschlagen')}};
$('#undoWorkspace').onclick=()=>sendWorkspace({type:'undo'}).catch(()=>setConnection(false,'Übertragung fehlgeschlagen'));$('#clearWorkspace').onclick=()=>{if(confirm('Deinen Workspace wirklich leeren?'))sendWorkspace({type:'clear'}).catch(()=>setConnection(false,'Übertragung fehlgeschlagen'))};
$$('[data-state]').forEach(b=>b.onclick=async()=>{if(!token)return;try{await rpc('classroom_student_update',{p_student_token:token,p_state:b.dataset.state});$$('[data-state]').forEach(x=>x.classList.toggle('active',x===b))}catch(e){setConnection(false,'Übertragung fehlgeschlagen')}});
vp.addEventListener('pointerdown',e=>{if(e.target!==vp&&e.target!==world)return;if(tool!=='pan'||follow)return;pan={x:e.clientX,y:e.clientY,tx,ty};vp.setPointerCapture(e.pointerId)});vp.addEventListener('pointermove',e=>{if(!pan)return;tx=pan.tx+e.clientX-pan.x;ty=pan.ty+e.clientY-pan.y;transform()});vp.addEventListener('pointerup',()=>pan=null);
$('#zoomPlus').onclick=()=>{if(follow)return;scale=Math.min(2.2,scale*1.18);transform()};$('#zoomMinus').onclick=()=>{if(follow)return;scale=Math.max(.18,scale/1.18);transform()};$('#fullscreenBtn').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};
async function tryResume(){if(!token)return;try{const s=await rpc('classroom_student_state',{p_student_token:token});if(!s?.ok)throw Error();$('#who').textContent=localStorage.getItem('kathleenStudentName')||'Verbunden';$('#join').classList.add('hidden');$('#room').classList.remove('hidden');transform();await loadWorkspace();beginPolling()}catch(e){sessionStorage.removeItem('kathleenStudentToken');token=''}}tryResume();
})();
</script>
</body></html>
