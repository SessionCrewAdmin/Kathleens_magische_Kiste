(()=>{'use strict';const $=s=>document.querySelector(s),SB='https://fzqxnjhuvgpgovcovosl.supabase.co/rest/v1/rpc/',KEY='sb_publishable_GIyyWoyaQXipaA4S9OuTyQ_cZn7LUgV',world=$('#world'),canvas=$('#ink'),ctx=canvas.getContext('2d'),room=(new URLSearchParams(location.search).get('room')||'').toUpperCase();let lastPayload='',wakeLock=null,lastOk=0;$('#roomBadge').textContent=room||'------';document.title=room?'Raum '+room+' · Präsentation':'Präsentation';
async function rpc(n,b){const r=await fetch(SB+n,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(b)});const x=await r.json().catch(()=>null);if(!r.ok)throw Error(x?.message||r.status);return x}
function draw(strokes){ctx.clearRect(0,0,6000,4000);ctx.lineCap='round';ctx.lineJoin='round';for(const s of strokes||[]){ctx.beginPath();ctx.strokeStyle=s.color||'#6d4d73';ctx.lineWidth=s.width||4;ctx.globalAlpha=s.alpha??1;(s.points||[]).forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}ctx.globalAlpha=1}
function render(b,v){if(!b)return;const key=JSON.stringify([b,v]);if(key===lastPayload)return;lastPayload=key;world.className='world '+(b.bg||'');world.querySelectorAll('.item').forEach(e=>e.remove());for(const o of b.items||[]){const e=document.createElement('div');e.className='item '+(o.type==='sticky'?'sticky':o.type==='text'?'textitem':'widget');e.style.cssText='left:'+o.x+'px;top:'+o.y+'px;width:'+o.w+'px;height:'+o.h+'px;transform:rotate('+(o.rotation||0)+'deg);z-index:'+(o.z||0);e.innerHTML='<div class="body">'+(o.widgetType&&window.KathleenWidgets?'':(o.html||''))+'</div>';world.appendChild(e);if(o.widgetType&&window.KathleenWidgets)window.KathleenWidgets.mount(e.querySelector('.body'),window.KathleenWidgets.migrate(o),{mode:'presentation',interactive:false})}draw(b.strokes||[]);const z=v?.scale||b.viewport?.scale||.65,x=v?.tx??b.viewport?.tx??-500,y=v?.ty??b.viewport?.ty??-350;world.style.transform='translate('+x+'px,'+y+'px) scale('+z+')'}
function setOnline(on,text){$('#statusDot').classList.toggle('online',on);$('#statusText').textContent=text|| (on?'live':'offline')}
async function poll(){try{const s=await rpc('classroom_presentation_state',{p_room_code:room});if(!s?.ok){$('#offline').classList.remove('hidden');setOnline(false,'Raum offline');return}lastOk=Date.now();$('#offline').classList.add('hidden');setOnline(true,'live');$('#freeze').classList.toggle('hidden',!s.frozen);$('#phase').textContent=({explain:'👀 Erklärung',solo:'✏️ Einzelarbeit',group:'👥 Gruppenarbeit',class:'✨ Klassenaufgabe',break:'☕ Pause',free:'Unterricht'})[s.phase]||s.phase;$('#traffic').style.background=({green:'#59b887',yellow:'#f2c75a',red:'#df6a75'})[s.traffic]||'#59b887';render(s.board_state,s.viewport)}catch(e){console.warn(e);setOnline(false,Date.now()-lastOk<7000?'verbindet neu …':'offline')}}
async function keepAwake(){try{if('wakeLock' in navigator&&!wakeLock)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}

document.addEventListener('fullscreenchange',()=>$('#fullscreenBtn').textContent=document.fullscreenElement?'⤢ Vollbild verlassen':'⛶ Vollbild');document.addEventListener('visibilitychange',()=>{if(!document.hidden)keepAwake()});window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')$('#fullscreenBtn').click()});keepAwake();poll();setInterval(poll,1200)})();
