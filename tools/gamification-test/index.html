<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quest Systemtest</title><style>body{font-family:Inter,Arial;background:#fff9fc;color:#503d51;padding:24px}main{max-width:850px;margin:auto}.box{background:#fff;border:1px solid #eadde9;border-radius:20px;padding:18px;margin:10px 0}.ok{color:#39836a}.bad{color:#b04f66}button{padding:11px 14px;border:1px solid #eadde9;border-radius:12px;background:#fff;font-weight:900}</style></head><body><main><h1>🧪 Quest Mode Systemtest</h1><p>Prüft Core, Klassenanbindung, Datenmodell, Aktionen, Boss, Teams, Schüleransicht und Persistenz. Testdaten werden anschließend zurückgesetzt.</p><button id="run">Tests starten</button><div id="out"></div></main><script src="../classroom-tools-shared.js"></script><script src="../lesson-mode.js"></script><script src="../gamification-preview.js"></script><script>const rows=[];function t(n,fn){try{const x=fn();rows.push([n,!!x,x?'OK':'FEHLER'])}catch(e){rows.push([n,false,e.message])}}run.onclick=()=>{rows.length=0;const g=KathleenGamification,backup=localStorage.getItem(g.key);t('Gamification Core geladen',()=>!!g&&!!g.addXP);t('Klassenlisten API geladen',()=>!!KathleenClassLists);const before=g.load();t('V3 Datenmodell',()=>before.version===3);t('Aktionskatalog',()=>Object.keys(g.actions).length>=6);const c=before.classes[before.activeClassId];if(c){const xp=c.classXp;g.addXP({amount:1,reason:'Systemtest'});t('XP schreiben',()=>g.load().classes[before.activeClassId].classXp===xp+1);g.boss(true);t('Boss starten',()=>g.load().classes[before.activeClassId].boss.active===true);g.teams(2);t('Teams erzeugen',()=>g.load().classes[before.activeClassId].teams.length===2);const st=Object.values(g.load().classes[before.activeClassId].students)[0];if(st)t('Getrennte Schüleransicht',()=>g.studentView(st.id)?.student?.name===st.name);else rows.push(['Schüleransicht',false,'Keine Schüler in aktiver Klasse'])}else rows.push(['Aktive Klasse',false,'Klassenliste entsperren / Klasse wählen']);if(backup===null)localStorage.removeItem(g.key);else localStorage.setItem(g.key,backup);out.innerHTML=rows.map(r=>'<div class="box '+(r[1]?'ok':'bad')+'"><b>'+(r[1]?'✓ ':'✕ ')+r[0]+'</b><br><small>'+r[2]+'</small></div>').join('')};</script></body></html>
