<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quest Remote</title><style>*{box-sizing:border-box}body{margin:0;background:#fff9fc;color:#503d51;font-family:Inter,Arial;padding:18px 14px calc(30px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;background:#fff9fce8;backdrop-filter:blur(14px);padding:8px 0 14px;z-index:2}h1{margin:4px 0;font-size:27px}.card{background:#fff;border:1px solid #eadde9;border-radius:20px;padding:14px;margin:10px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}button,select{min-height:52px;border:1px solid #eadde9;border-radius:14px;background:#fff;color:#604b63;font-weight:950;font-size:14px;padding:10px}.primary{background:linear-gradient(135deg,#efa5c7,#b9a6e8);color:#fff;border:0}.students{display:grid;gap:7px}.student{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}.student button{min-height:44px}.muted{font-size:11px;color:#8d788f}</style></head><body><header class="top"><small>iPHONE TEACHER REMOTE</small><h1 id="name">Quest Remote</h1><div class="muted" id="status"></div></header><section class="card"><div class="actions" id="quick"></div></section><section class="card"><b>Schüler-Schnellaktion</b><div class="students" id="students"></div></section><script src="../classroom-tools-shared.js"></script><script src="../gamification-preview.js"></script><script>const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){const g=KathleenGamification,s=g.load(),c=g.current();if(!c)return;document.getElementById('name').textContent=c.name+' · Quest Remote';document.getElementById('status').textContent=c.classXp+' XP · 🔥 '+c.combo+'× · Boss '+(c.boss.active?c.boss.progress+'/'+c.boss.target:'aus');quick.innerHTML=Object.entries(g.actions).slice(0,5).map(([k,a])=>'<button data-a="'+k+'">'+a.icon+' '+a.label+'</button>').join('')+'<button class="primary" data-boss>👾 Boss</button>';quick.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>g.action(x.dataset.a));quick.querySelector('[data-boss]').onclick=()=>g.boss(true);students.innerHTML=Object.values(c.students).map(st=>'<div class="student"><span><b>'+esc(st.name)+'</b><br><small>'+st.xp+' XP · L'+st.level+'</small></span><button data-s="'+esc(st.id)+'">🙋 +15</button></div>').join('');students.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{g.action('participation',x.dataset.s);draw()})}draw();addEventListener('kathleen:gamification',draw);setInterval(draw,1500);</script></body></html>
