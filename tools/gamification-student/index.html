<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quest Profil</title><style>:root{--ink:#503d51;--line:#eadde9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,#ffe2ef,transparent 35%),radial-gradient(circle at 90% 10%,#eee8ff,transparent 35%),#fffafd;color:var(--ink);font-family:Inter,Arial}.card{width:min(650px,96vw);border:1px solid var(--line);border-radius:28px;padding:24px;background:#ffffffdf;box-shadow:0 30px 90px #76527124}.k{font-size:10px;font-weight:900;letter-spacing:.14em;color:#9c8199}h1{margin:7px 0}.hero{display:flex;justify-content:space-between;gap:12px;align-items:center}.avatar{width:72px;height:72px;border-radius:23px;display:grid;place-items:center;background:linear-gradient(145deg,#ffe2ef,#eee8ff);font-size:30px;font-weight:1000}.bar{height:12px;border-radius:99px;background:#f0e7ef;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#efa5c7,#b9a6e8)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid var(--line);border-radius:17px;padding:14px;background:#fff}.tags{display:flex;gap:6px;flex-wrap:wrap}.tags span{padding:6px 8px;border-radius:999px;background:#f7f1fa;font-size:11px}.muted{color:#927e91;font-size:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="card" id="app"><div class="k">KATHLEENS MAGISCHE KISTE · SCHÜLERPROFIL</div><h1>Quest Profil</h1><p class="muted">Dieses Profil zeigt nur deinen eigenen Fortschritt und den gemeinsamen Klassenfortschritt.</p><div id="view">Profil wird geladen …</div></main><script src="../classroom-tools-shared.js"></script><script src="../gamification-preview.js?v=20260922-firstnames1"></script><script>const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function draw(){const id=new URLSearchParams(location.search).get('student'),g=window.KathleenGamification;if(!id||!g){view.innerHTML='<p>Kein Profil ausgewählt.</p>';return}const x=g.studentView(id);if(!x){view.innerHTML='<p>Profil ist auf diesem Gerät nicht verfügbar.</p>';return}const s=x.student,p=Math.round((s.xp%250)/250*100),w=x.classProgress.weekly;view.innerHTML='<div class="hero"><div><h2>'+e(s.name)+'</h2><b>Level '+s.level+' · '+e(s.levelName)+'</b><p>🔥 Streak '+s.streak+' · '+s.xp+' XP</p></div><div class="avatar">'+e(s.name.charAt(0))+'</div></div><div class="bar"><i style="width:'+p+'%"></i></div><div class="grid"><section class="box"><b>🏅 Erfolge</b><div class="tags">'+(s.badges.length?s.badges.map(b=>'<span>'+b.icon+' '+e(b.title)+'</span>').join(''):'<span>Noch keine Badges</span>')+'</div></section><section class="box"><b>🏆 Gemeinsam</b><p>Klasse: '+x.classProgress.xp+' XP</p><p>'+e(w.title)+': '+w.progress+'/'+w.target+'</p></section></div>'}draw();</script></body></html>
