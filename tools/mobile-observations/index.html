(()=>{'use strict';const K=window.KathleenClassLists,S='grade-observation-periods-v1',H='homework-strikes-v1',E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),day=()=>new Date().toISOString().slice(0,10);let db,p,cl,filter='all';const label=m=>({pp:'++',p:'+',n:'•',m:'−',mm:'−−',note:'✎'})[m]||m;async function save(){await K.secureSet(S,db)}function flash(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('on');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('on'),900);navigator.vibrate?.(18)}function today(n){return(p?.events||[]).filter(e=>e.student===n&&String(e.at).slice(0,10)===day())}function render(){document.getElementById('title').textContent=(p?.subject||'Beobachtungen')+' · '+(cl?.name||'');document.getElementById('period').textContent=p?p.title:'Kein offener Beobachtungszeitraum';let names=cl?.students||[];if(filter!=='all')names=names.filter(n=>filter==='rated'?today(n).length:!today(n).length);document.getElementById('list').innerHTML=!p?'<div class="empty"><h3>Beobachtungen starten</h3><p>Du kannst einen neuen Zeitraum direkt hier auf dem iPhone anlegen.</p><div class="startperiod"><label>FACH</label><select id="startSubject"><option>Englisch</option><option>Geschichte</option></select><button id="startPeriod">＋ Neuen Zeitraum starten</button></div></div>':names.map(n=>'<article class="row" data-n="'+E(n)+'"><div class="name"><b>'+E(n)+'</b><span>'+(today(n).length?today(n).length+'× heute':'noch nicht heute')+'</span></div><div class="marks"><button data-m="pp">++</button><button data-m="p">+</button><button data-m="n">•</button><button data-m="m">−</button><button data-m="mm">−−</button></div><div class="rowactions"><button class="notequick" data-newnote>＋ Notiz</button><button class="undoquick" data-undo title="Letzte Eingabe zurücknehmen" '+(today(n).length?'':'disabled')+'>↶</button></div></article>').join('');if(!p){const sel=document.getElementById('startSubject'),hint=window.__obsSubjectHint||'';if(sel&&hint&&[...sel.options].some(o=>o.value===hint))sel.value=hint;document.getElementById('startPeriod')?.addEventListener('click',()=>createPeriod(sel?.value||'Englisch'));return}document.querySelectorAll('.row').forEach(r=>{const n=r.dataset.n;r.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>mark(n,b.dataset.m));r.querySelector('.name').onclick=()=>sheet(n);r.querySelector('[data-newnote]').onclick=()=>noteSheet(n);r.querySelector('[data-undo]').onclick=()=>undoLast(n)})}async function undoLast(n){if(!p)return;const ids=(p.events||[]).map((e,i)=>({e,i})).filter(x=>x.e.student===n&&String(x.e.at).slice(0,10)===day());if(!ids.length)return;const last=ids.sort((a,b)=>String(b.e.at).localeCompare(String(a.e.at)))[0];p.events.splice(last.i,1);p.updatedAt=new Date().toISOString();await save();flash(n+' · letzte Eingabe zurückgenommen ↶');render()}

async function ha(n){let h=await K.secureGet(H,{version:1,records:{}})||{version:1,records:{}};h.records=h.records||{};const k=cl.id+'::'+String(p.subject||'Ohne Fach').toLocaleLowerCase('de-DE');h.records[k]=h.records[k]||{};(h.records[k][n]=Array.isArray(h.records[k][n])?h.records[k][n]:[]).push({at:day(),note:'Mobile Beobachtung'});await K.secureSet(H,h);KathleenLessonMode?.log?.('homework',{student:n,subject:p.subject});flash(n+' · HA fehlt ✓')}function sheet(n){const ev=(p.events||[]).filter(e=>e.student===n).sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,3),o=document.createElement('div');o.className='sheet';o.innerHTML='<div class="card"><div class="grab"></div><div class="cardhead"><h2>'+E(n)+'</h2><button class="close">×</button></div><div class="actions"><button data-note>✎ Notiz</button><button data-ha>✓ HA fehlt</button></div><div class="hist">'+(ev.length?ev.map(e=>'<div><b>'+label(e.mark)+'</b><span>'+new Date(e.at).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+(e.note?' · '+E(e.note):'')+'</span></div>').join(''):'<div>Noch keine Beobachtungen.</div>')+'</div></div>';document.body.appendChild(o);const close=()=>o.remove();o.querySelector('.close').onclick=close;o.onclick=e=>{if(e.target===o)close()};o.querySelector('[data-note]').onclick=()=>{close();noteSheet(n)};o.querySelector('[data-ha]').onclick=async()=>{close();await ha(n)}}document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b));render()});(async()=>{await K.requireUnlock();db=await K.secureGet(S,{version:1,periods:[]})||{version:1,periods:[]};const g=K.getGlobalClass?.(),lists=K.load();cl=K.get(g?.id)||lists[0]||null;const lm=KathleenLessonMode?.get?.(),subject=lm?.classId===cl?.id?lm.subject:'';window.__obsSubjectHint=subject||((db.periods||[]).filter(x=>x.classId===cl?.id).sort((a,b)=>String(b.updatedAt||b.createdAt).localeCompar
